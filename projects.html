<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">

<title>WorkDesk — Projects</title>

<script>/* set the skin before first paint (js/theme.js owns the rest) */(function(){var c='theme-light';try{var m=localStorage.getItem('wd_mode')||'auto';if(m==='dark'||(m==='auto'&&window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches))c='theme-dark';}catch(e){}document.documentElement.classList.add(c);})();</script>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/themes.css">
<link rel="stylesheet" href="css/ui.css?v=20261030">
</head>
<body>
<div class="wd-page" id="main" role="main">
  <header class="wd-appbar">
    <a href="index.html" class="wd-brand" aria-label="WorkDesk"><img class="wd-mark" src="icons/icon-mark.svg" alt="" width="30" height="30"><span class="wd-name"><b>Work</b><i>Desk</i></span></a>
    <button type="button" class="wd-av" id="me-btn" aria-label="Your profile and settings">·</button>
  </header>

  <div class="wd-title">
    <h1 class="wd-h1">Projects</h1>
    <button type="button" class="rpt-share prj-new" onclick="openProjectForm()"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>New project</button>
  </div>
  <div class="wd-sub prj-subrow">
    <span id="prj-sub">&nbsp;</span>
    <span class="prj-sub-r"><button type="button" class="wd-link" id="org-btn" onclick="openOrganise()">Merge</button><button type="button" class="wd-link" id="view-btn" onclick="toggleView()">Landscape view</button></span>
  </div>

  <div class="wd-filter-chips prj-chips" id="prj-chips" role="tablist" aria-label="Projects" hidden></div>

  <div class="prj-panel" id="prj-panel" aria-live="polite">
    <div class="wd-skel" aria-hidden="true">
      <div class="wd-skel-sum"><div><i style="width:170px;height:20px"></i><i style="width:120px;height:11px"></i></div><b></b></div>
      <div class="wd-skel-row"><b></b><div><i style="width:66%"></i><i style="width:40%;height:11px"></i></div></div>
      <div class="wd-skel-row"><b></b><div><i style="width:54%"></i><i style="width:32%;height:11px"></i></div></div>
      <div class="wd-skel-row"><b></b><div><i style="width:60%"></i><i style="width:36%;height:11px"></i></div></div>
    </div>
  </div>

  <section class="wd-all prj-done" id="prj-done" hidden>
    <button type="button" class="wd-disc" id="prj-done-toggle" aria-expanded="false" aria-controls="prj-done-body" onclick="toggleCompleted()">
      <span>Completed projects</span><span class="n" id="prj-done-count">0</span><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>
    </button>
    <div id="prj-done-body" class="wd-disc-body" hidden></div>
  </section>
</div>

<script type="module">
import { onUserReady, WORKSPACE_ID, onTasksChanged, getProjects, setProjectComplete, reopenProject, updateTask } from './js/firebase.js';
import { getApps } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
import { getFirestore, collection, doc, setDoc, deleteDoc, getDocs, serverTimestamp } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';
import { initShell } from './js/shell.js';
import { esc, initials, ICON, glyphSVG, STATUS_LABEL, ringHTML, openSheet, closeSheet, sheetBody, showUndo, showNote, localDateStr, dayDiff, dueLabel, dayMonth, projHue, PRIO_LABEL, starOf } from './js/ui.js';

const $ = id => document.getElementById(id);
const haptic = n => { try { navigator.vibrate && navigator.vibrate(n); } catch (e) {} };
const CHEV = ICON.chevron.replace('width="22" height="22"', 'width="20" height="20"');
const PLUS = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>';
const MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
const monthLabel = m => { const [y, mo] = m.split('-'); return MONTHS[parseInt(mo) - 1] + ' ' + y; };
const plural = (n, one, many) => n + ' ' + (n === 1 ? one : many);

// ── state ──────────────────────────────────────────────────────────────────
let allTasks = [];
let tasksLoaded = false;
let projectsData = {};          // completion flags from getProjects(), keyed by btoa(name)
let projectMeta = {};           // description / target date from the projectMeta collection, same keys
let activeProject = null;       // the project whose panel is open
let completedOpen = false;
const openFolds = new Set();    // `${project}|${fold}` — folds stay as the person left them across live updates
let editingName = null;         // set while the sheet is editing rather than creating
let projView = 'portrait';      // 'portrait' | 'landscape' (own key, independent of the calendar's)
try { if (localStorage.getItem('projView') === 'landscape') projView = 'landscape'; } catch (e) {}

initShell();
applyView();

// Reuse the Firebase app that firebase.js already started.
const db = getFirestore(getApps()[0]);
// A small additive collection for what a project has no other home for
// (description, target date). Task-to-project linkage and completion stay
// exactly where they were: t.project on each task, and getProjects() /
// setProjectComplete() / reopenProject().
const metaCol = () => collection(db, 'workspaces', WORKSPACE_ID, 'projectMeta');
const metaDoc = key => doc(db, 'workspaces', WORKSPACE_ID, 'projectMeta', key);

// Must stay identical to the btoa(name) keying report.html uses, or completion
// state stops lining up with existing completed projects. A name outside
// Latin-1 (which the shared functions can't key either) falls back to a
// local-only key instead of crashing the page.
function keyFor(name) {
  try { return btoa(name); }
  catch (e) { return 'x_' + encodeURIComponent(name); }
}

// ── bootstrap ──────────────────────────────────────────────────────────────
onUserReady(async () => {
  try { projectsData = (await getProjects()) || {}; } catch (e) { projectsData = {}; }
  try { await loadProjectMeta(); } catch (e) { projectMeta = {}; }
  onTasksChanged(({ tasks }) => { allTasks = tasks || []; tasksLoaded = true; renderAll(); });
  // if the first snapshot never arrives, stop showing the skeleton
  setTimeout(() => { if (!tasksLoaded) { tasksLoaded = true; renderAll(); } }, 6000);
});

async function loadProjectMeta() {
  const snap = await getDocs(metaCol());
  const out = {};
  snap.forEach(d => { out[d.id] = d.data(); });
  projectMeta = out;
}

// ── aggregation ────────────────────────────────────────────────────────────
function computeProjectList() {
  const names = new Set();
  allTasks.forEach(t => { if (t.project) names.add(t.project); });
  Object.values(projectMeta).forEach(p => { if (p && p.name) names.add(p.name); });
  Object.values(projectsData).forEach(p => { if (p && p.name) names.add(p.name); });
  return [...names].sort((a, b) => a.localeCompare(b));
}

const statusOf = t => (['todo', 'inprog', 'onhold', 'done'].includes(t.status) ? t.status : 'todo');

// ── project helpers ────────────────────────────────────────────────────────
// (Groups were replaced by merging. Old `group` values may still sit on a
// project's projectMeta doc; they are only read to suggest merges.)
const metaOf = n => projectMeta[keyFor(n)] || {};
const legacyGroupOf = n => String(metaOf(n).group || '').trim();
const taskCount = n => allTasks.filter(t => t.project === n).length;
const biggest = list => [...list].sort((a, b) => taskCount(b) - taskCount(a) || a.localeCompare(b))[0];

function projectStats(name) { return statsOf(allTasks.filter(t => t.project === name)); }
function statsOf(tasks) {
  const count = s => tasks.filter(t => statusOf(t) === s).length;
  const total = tasks.length, done = count('done');
  const open = tasks.filter(t => statusOf(t) !== 'done' && t.taskDueDate);
  return {
    tasks, total, done,
    inprog: count('inprog'), onhold: count('onhold'), todo: count('todo'),
    overdue: open.filter(t => dayDiff(t.taskDueDate) < 0).length,
    dueSoon: open.filter(t => { const d = dayDiff(t.taskDueDate); return d >= 0 && d <= 3; }).length,
    pct: total ? Math.round(done / total * 100) : 0,
  };
}

function projectHealth(s, isCompleted) {
  if (isCompleted) return { key: 'done', label: 'Completed' };
  if (!s.total) return { key: 'empty', label: 'No tasks yet' };
  if (s.overdue) return { key: 'late', label: s.overdue + ' overdue' };
  if (s.dueSoon) return { key: 'soon', label: s.dueSoon + ' due soon' };
  return { key: 'ok', label: 'On track' };
}

function memberBreakdown(tasks) {
  const map = {};
  tasks.forEach(t => {
    (t.members || []).forEach(m => {
      const key = m.id || m.name;
      if (!map[key]) map[key] = { name: m.name, done: 0, total: 0 };
      map[key].total++;
      const st = (t.memberStatus && m.id && t.memberStatus[m.id] !== undefined) ? t.memberStatus[m.id] : t.status;
      if (st === 'done') map[key].done++;
    });
  });
  return Object.values(map)
    .map(m => ({ ...m, pct: m.total ? Math.round(m.done / m.total * 100) : 0 }))
    .sort((a, b) => b.total - a.total);
}

// ── render ─────────────────────────────────────────────────────────────────
function renderAll() {
  const names = computeProjectList();
  const active = [], completed = [];
  names.forEach(n => (projectsData[keyFor(n)] ? completed : active).push(n));
  if (!tasksLoaded) return;                 // the skeleton holds the place until then

  $('prj-sub').textContent = names.length ? active.length + ' active · ' + completed.length + ' completed' : 'Nothing here yet';

  if (!names.length) {
    activeProject = null;
    renderChips([]);
    $('prj-panel').classList.remove('has');
    $('prj-panel').innerHTML = `<div class="wd-empty"><b>No projects yet</b>Projects group tasks so you can follow them as a whole. Create one here, or type a project name the next time you add a task.</div>
      <div class="prj-empty-act"><button type="button" class="wd-btn p" onclick="openProjectForm()">Create your first project</button></div>`;
    renderCompleted([]);
    return;
  }
  // keep the selection pointing at something that still exists
  if (activeProject && !names.includes(activeProject)) activeProject = null;
  if (!activeProject) activeProject = active[0] || completed[0];
  renderChips(active);
  renderPanel();
  renderCompleted(completed);
}

const LATE_DOT = '<i class="prj-late" role="img" aria-label="has overdue tasks"></i>';
function renderChips(active) {
  const el = $('prj-chips');
  if (!active.length) { el.hidden = true; el.innerHTML = ''; return; }
  const keep = el.scrollLeft;
  el.hidden = false;
  el.innerHTML = active.map(n => {
    const on = n === activeProject;
    return `<button type="button" class="wd-chip${on ? ' on' : ''}" aria-pressed="${on}" data-name="${esc(n)}">${esc(n)}${projectStats(n).overdue > 0 ? LATE_DOT : ''}</button>`;
  }).join('');
  el.scrollLeft = keep;
}

function renderCompleted(completed) {
  const wrap = $('prj-done');
  if (!completed.length) { wrap.hidden = true; $('prj-done-body').innerHTML = ''; return; }
  wrap.hidden = false;
  $('prj-done-count').textContent = completed.length;
  $('prj-done-toggle').setAttribute('aria-expanded', completedOpen);
  $('prj-done-body').hidden = !completedOpen;
  $('prj-done-body').innerHTML = completed.map(n => {
    const pd = projectsData[keyFor(n)] || {};
    return `<button type="button" class="prj-crow${n === activeProject ? ' on' : ''}" data-proj="${esc(n)}" style="--proj:${projHue(n)}"><span class="wd-pd"></span><span class="nm">${esc(n)}</span><span class="when">${pd.completedMonth ? esc(monthLabel(pd.completedMonth)) : ''}</span></button>`;
  }).join('');
}

function targetText(date, isCompleted) {
  const y = date.slice(0, 4);
  const label = 'Target ' + dayMonth(date) + (y !== String(new Date().getFullYear()) ? ' ' + y : '');
  const diff = dayDiff(date);
  if (!isCompleted && diff < 0) return { text: label + ' · ' + dueLabel(date), late: true };
  return { text: label, late: false };
}

function taskRow(t) {
  const st = statusOf(t);
  let due = '';
  if (t.taskDueDate && st !== 'done') {
    const d = dayDiff(t.taskDueDate);
    due = d < 0 ? `<span class="wd-late-txt">${esc(dueLabel(t.taskDueDate))}</span>`
      : 'due ' + esc(d === 0 || d === 1 ? dueLabel(t.taskDueDate).toLowerCase() : dueLabel(t.taskDueDate));
  }
  const names = (t.members || []).map(m => m.name).filter(Boolean).join(', ');
  const bits = [esc(STATUS_LABEL[st]), esc(PRIO_LABEL[t.priority] || PRIO_LABEL.medium), due, names ? 'with ' + esc(names) : ''].filter(Boolean).join(' · ');
  return `<div class="rpt-task${st === 'done' ? ' is-done' : ''}"><span class="g" style="--proj:${projHue(t.project)}">${glyphSVG(st, 20)}</span><div><b>${starOf(t)}${esc(t.label)}</b><span>${bits}</span></div></div>`;
}

function foldHTML(key, label, n, inner) {
  const open = openFolds.has(activeProject + '|' + key);
  return `<div class="rpt-fold"><button type="button" class="wd-disc" aria-expanded="${open}" aria-controls="fb-${key}" data-fold="${key}"><span>${label}</span><span class="n">${n}</span>${CHEV}</button><div class="rpt-fold-body" id="fb-${key}"${open ? '' : ' hidden'}>${inner}</div></div>`;
}

function renderPanel() {
  if (!activeProject) return;
  const name = activeProject;
  const key = keyFor(name);
  const isDone = !!projectsData[key];
  const s = projectStats(name);
  const health = projectHealth(s, isDone);
  const meta = projectMeta[key] || {};
  const members = memberBreakdown(s.tasks);

  // header: name, what it is, where it stands
  const bits = [];
  if (isDone) bits.push(`<span>Completed${projectsData[key].completedMonth ? ' ' + esc(monthLabel(projectsData[key].completedMonth)) : ''}</span>`);
  else if (health.key !== 'empty') bits.push(`<span${health.key === 'late' ? ' class="late"' : ''}>${esc(health.label)}</span>`);
  if (meta.targetDate) {
    const tt = targetText(meta.targetDate, isDone);
    bits.push(`<span${tt.late ? ' class="late"' : ''}>${esc(tt.text)}</span>`);
  }
  const head = `<div class="prj-head" style="--proj:${projHue(name)}">
    <h2 class="prj-name"><span class="wd-pd"></span><span>${esc(name)}</span></h2>
    ${meta.description ? `<p class="prj-desc">${esc(meta.description)}</p>` : ''}
    ${bits.length ? `<p class="prj-meta">${bits.join(' · ')}</p>` : ''}
  </div>`;

  // progress
  const subBits = [s.inprog ? s.inprog + ' in progress' : '', s.onhold ? s.onhold + ' on hold' : ''].filter(Boolean);
  const sumTitle = s.total ? `${s.done} of ${plural(s.total, 'task', 'tasks')} done` : 'No tasks yet';
  const sumSub = !s.total ? 'Add the first task to get going' : subBits.length ? subBits.join(' · ') : (s.pct === 100 ? 'Everything is done' : plural(s.todo, 'task', 'tasks') + ' to do');
  const summary = `<div class="rpt-sum">${ringHTML(s.pct, 76, 6, s.pct + '%')}<div class="rs"><b>${sumTitle}</b><span>${esc(sumSub)}</span></div></div>`;

  const pctOf = n => (s.total ? Math.round(n / s.total * 100) : 0);
  const stat = (label, n, pct) => `<div class="prj-stat" style="--p:${pct}"><span class="k">${label}</span><b>${n}<i> / ${s.total}</i></b><span class="bar"><i></i><em>${pct}%</em></span></div>`;
  const stats = s.total ? `<div class="prj-stats">${stat('Done', s.done, s.pct)}${stat('In progress', s.inprog, pctOf(s.inprog))}</div>` : '';

  const acts = `<div class="prj-acts">
    <a class="wd-btn p" href="input.html?project=${encodeURIComponent(name)}">${PLUS}Add task</a>
    <button type="button" class="wd-btn s" data-act="edit">Edit</button>
    <button type="button" class="wd-btn s" data-act="toggle">${isDone ? 'Reopen' : 'Mark complete'}</button>
  </div>${computeProjectList().some(n => n !== name && !projectsData[keyFor(n)]) ? '<button type="button" class="wd-link prj-merge-link" data-act="merge-into">Merge into another project</button>' : ''}`;

  // tasks: what is open first (in progress, then to do, soonest due first); the rest folded
  const rank = t => (statusOf(t) === 'inprog' ? 0 : 1);
  const byDue = (a, b) => rank(a) - rank(b) || (a.taskDueDate || '9999').localeCompare(b.taskDueDate || '9999');
  const open = s.tasks.filter(t => ['inprog', 'todo'].includes(statusOf(t))).sort(byDue);
  const hold = s.tasks.filter(t => statusOf(t) === 'onhold').sort(byDue);
  const done = s.tasks.filter(t => statusOf(t) === 'done');
  const list = rows => `<div class="rpt-list">${rows.map(taskRow).join('')}</div>`;
  let tasks = '';
  if (s.total) {
    tasks = `<div class="rpt-h2"><span>Open tasks</span><span class="n">${open.length}</span></div>`;
    if (open.length) tasks += list(open);
    else tasks += `<div class="wd-empty"><b>Nothing open</b>Every task in this project is done or on hold.</div>`;
    if (hold.length) tasks += foldHTML('hold', 'On hold', hold.length, list(hold));
    if (done.length) tasks += foldHTML('done', 'Done', done.length, list(done));
  }

  const team = members.length
    ? foldHTML('team', 'Team', members.length, `<div class="rpt-list">${members.map(m =>
        `<div class="rpt-member"><span class="wd-av sm quiet">${esc(initials(m.name))}</span><div class="rpt-member-b"><b>${esc(m.name)}</b><span class="rpt-bar"><i style="width:${m.pct}%"></i></span></div><span class="rpt-member-pct">${m.done}/${m.total}</span></div>`).join('')}</div>`)
    : '';

  const panel = $('prj-panel');
  panel.classList.add('has');
  panel.innerHTML = `<div class="prj-left">${head}${summary}${stats}${acts}</div><div class="prj-right">${tasks}</div>${team ? `<div class="prj-team${hold.length || done.length ? ' tight' : ''}">${team}</div>` : ''}`;
  // light skin lists folds as one run of rules; the Completed row joins it when something fold-like sits above
  $('prj-done').classList.toggle('tight', !!(team || hold.length || done.length));
}

// ── interaction ────────────────────────────────────────────────────────────
function selectProject(name, { top = false } = {}) {
  if (!name) return;
  activeProject = name;
  renderAll();
  document.querySelectorAll('.prj-chips .wd-chip.on').forEach(on => on.scrollIntoView && on.scrollIntoView({ inline: 'center', block: 'nearest' }));
  if (top) window.scrollTo({ top: 0, behavior: 'smooth' });
  haptic(4);
}
$('prj-chips').addEventListener('click', e => {
  const chip = e.target.closest('[data-name]');
  if (chip) selectProject(chip.dataset.name);
});
$('prj-done-body').addEventListener('click', e => {
  const row = e.target.closest('[data-proj]');
  if (row) selectProject(row.dataset.proj, { top: true });
});
$('prj-panel').addEventListener('click', e => {
  const fold = e.target.closest('[data-fold]');
  if (fold) {
    const k = activeProject + '|' + fold.dataset.fold;
    const open = !openFolds.has(k);
    if (open) openFolds.add(k); else openFolds.delete(k);
    fold.setAttribute('aria-expanded', open);
    document.getElementById(fold.getAttribute('aria-controls')).hidden = !open;
    return;
  }
  const row = e.target.closest('[data-proj]');
  if (row) { selectProject(row.dataset.proj, { top: true }); return; }
  const act = e.target.closest('[data-act]');
  if (!act) return;
  if (act.dataset.act === 'edit') openProjectForm(activeProject);
  else if (act.dataset.act === 'toggle') toggleComplete(activeProject);
  else if (act.dataset.act === 'merge-into') openMergeInto();
});

window.toggleCompleted = () => {
  completedOpen = !completedOpen;
  $('prj-done-toggle').setAttribute('aria-expanded', completedOpen);
  $('prj-done-body').hidden = !completedOpen;
};

function applyView() {
  const wide = projView === 'landscape';
  document.body.classList.toggle('proj-wide', wide);
  $('view-btn').textContent = wide ? 'Portrait view' : 'Landscape view';
}
window.toggleView = () => {
  projView = projView === 'landscape' ? 'portrait' : 'landscape';
  try { localStorage.setItem('projView', projView); } catch (e) {}
  applyView(); haptic(6);
};

// ── complete / reopen ──────────────────────────────────────────────────────
async function setComplete(name, makeDone) {
  const k = keyFor(name);
  try {
    if (makeDone) {
      const month = localDateStr().slice(0, 7);
      await setProjectComplete(name, month);
      projectsData[k] = { name, completedMonth: month };
    } else {
      await reopenProject(name);
      delete projectsData[k];
    }
  } catch (e) {
    console.error('Project update failed:', e);
    showNote('Could not update the project. Check your connection and try again.');
    return false;
  }
  renderAll();
  return true;
}
// Completing a project can also close what is still open in it. That is a
// choice, so it is asked, and one Undo reverses both the project and the tasks.
const openTasksOf = name => allTasks.filter(t => t.project === name && statusOf(t) !== 'done');
async function closeTasks(list) {
  // returns what each task looked like before, or null if any write failed (the ones that did go through are put back)
  const snap = list.map(t => ({ id: t.id, status: t.status || 'todo', memberStatus: t.memberStatus ? { ...t.memberStatus } : null }));
  const res = await Promise.allSettled(list.map(t => {
    const upd = { status: 'done' };
    (t.members || []).forEach(m => { if (m.id) upd['memberStatus.' + m.id] = 'done'; });
    return updateTask(t.id, upd);
  }));
  if (res.some(r => r.status === 'rejected')) {
    await restoreTasks(snap.filter((_, i) => res[i].status === 'fulfilled'));
    showNote('Could not update the tasks. Check your connection and try again.');
    return null;
  }
  return snap;
}
async function restoreTasks(snap) {
  await Promise.allSettled(snap.map(x => {
    const upd = { status: x.status, completedAt: null };
    if (x.memberStatus) upd.memberStatus = x.memberStatus;
    return updateTask(x.id, upd);
  }));
}
async function completeOnly(name) {
  if (!(await setComplete(name, true))) return;
  haptic([10, 30, 10]);
  showUndo('“' + name + '” marked complete', () => setComplete(name, false));
}
function openCompleteSheet(name, open) {
  const n = open.length;
  const sheet = openSheet('prj-close', `
    <h2 class="wd-sheet-title">Complete “${esc(name)}”?</h2>
    <div class="prj-form">
      <p class="prj-desc">${plural(n, 'task is', 'tasks are')} still open in this project. Mark ${n === 1 ? 'it' : 'them'} done for everyone assigned too?</p>
      <button type="button" class="wd-btn p" id="pc-all">Mark ${n === 1 ? 'it' : plural(n, 'task', 'tasks')} done and complete</button>
      <button type="button" class="wd-btn s" id="pc-only">Complete the project only</button>
      <button type="button" class="wd-btn s" id="pc-cancel">Cancel</button>
    </div>`);
  const btns = sheet.querySelectorAll('button');
  sheet.querySelector('#pc-cancel').onclick = () => closeSheet('prj-close');
  sheet.querySelector('#pc-only').onclick = async () => { btns.forEach(b => b.disabled = true); closeSheet('prj-close'); await completeOnly(name); };
  sheet.querySelector('#pc-all').onclick = async () => {
    btns.forEach(b => b.disabled = true);
    const snap = await closeTasks(open);
    if (!snap) { btns.forEach(b => b.disabled = false); return; }
    closeSheet('prj-close');
    if (!(await setComplete(name, true))) { await restoreTasks(snap); return; }
    haptic([10, 30, 10]);
    showUndo('“' + name + '” complete, ' + plural(n, 'task', 'tasks') + ' marked done', async () => { await setComplete(name, false); await restoreTasks(snap); }, 8000);
  };
}
async function toggleComplete(name) {
  const wasDone = !!projectsData[keyFor(name)];
  if (wasDone) {
    if (!(await setComplete(name, false))) return;
    haptic(6);
    showUndo('Reopened “' + name + '”', () => setComplete(name, true));
    return;
  }
  const open = openTasksOf(name);
  if (open.length) openCompleteSheet(name, open); else completeOnly(name);
}

// ── new / edit sheet ───────────────────────────────────────────────────────
window.openProjectForm = name => {
  editingName = name || null;
  const meta = name ? (projectMeta[keyFor(name)] || {}) : {};
  const sheet = openSheet('prj-form', `
    <h2 class="wd-sheet-title">${name ? 'Edit project' : 'New project'}</h2>
    <div class="prj-form">
      <div class="wd-lab">Name</div>
      <input class="wd-field" id="pf-name" maxlength="80" placeholder="e.g. Q4 town hall series" autocomplete="off" value="${esc(name || '')}"${name ? ' disabled aria-describedby="pf-name-note"' : ''}>
      ${name ? '<p class="wd-hint" id="pf-name-note">The name can’t change, because every task in the project uses it.</p>' : ''}
      <div class="wd-lab">Description<span class="opt">optional</span></div>
      <textarea class="wd-field" id="pf-desc" rows="3" maxlength="240" placeholder="What is this project about?">${esc(meta.description || '')}</textarea>
      <div class="wd-lab">Target date<span class="opt">optional</span></div>
      <input type="date" class="wd-field" id="pf-target" aria-label="Target date" value="${esc(meta.targetDate || '')}">
      <p class="wd-err" id="pf-err" role="alert" hidden></p>
      <button type="button" class="wd-btn p" id="pf-save">${name ? 'Save changes' : 'Create project'}</button>
      <button type="button" class="wd-btn s" id="pf-cancel">Cancel</button>
    </div>`);
  sheet.querySelector('#pf-save').onclick = saveProjectForm;
  sheet.querySelector('#pf-cancel').onclick = () => closeSheet('prj-form');
  sheet.querySelector('#pf-name').addEventListener('input', clearFormError);
  sheet.querySelector('#pf-name').addEventListener('keydown', e => { if (e.key === 'Enter') saveProjectForm(); });
  if (!name) setTimeout(() => { const f = $('pf-name'); if (f) f.focus(); }, 320);
};

function formError(msg) {
  const err = $('pf-err');
  err.textContent = msg; err.hidden = false;
  $('pf-name').classList.add('bad');
}
function clearFormError() {
  const err = $('pf-err'); if (err) err.hidden = true;
  const f = $('pf-name'); if (f) f.classList.remove('bad');
}

async function saveProjectForm() {
  const name = (editingName || $('pf-name').value).trim();
  if (!name) { formError('Enter a project name.'); $('pf-name').focus(); return; }
  if (!editingName && computeProjectList().some(n => n.toLowerCase() === name.toLowerCase())) {
    formError('A project called “' + name + '” already exists.'); $('pf-name').focus(); return;
  }
  const description = $('pf-desc').value.trim();
  const targetDate = $('pf-target').value || null;
  const k = keyFor(name);
  const btn = $('pf-save');
  const creating = !editingName;
  btn.disabled = true; btn.textContent = 'Saving…';
  try {
    await setDoc(metaDoc(k), {
      name, description, targetDate,
      updatedAt: serverTimestamp(),
      ...(creating ? { createdAt: serverTimestamp() } : {}),
    }, { merge: true });
  } catch (e) {
    console.error('Project save failed:', e);
    btn.disabled = false; btn.textContent = creating ? 'Create project' : 'Save changes';
    formError('Could not save. Check your connection and try again.');
    return;
  }
  projectMeta[k] = { ...(projectMeta[k] || {}), name, description, targetDate };
  activeProject = name;
  closeSheet('prj-form');
  renderAll();
  showNote(creating ? 'Project created' : 'Project updated');
  haptic(8);
}

// ── merge ──────────────────────────────────────────────────────────────────
// Merging renames the project on every task of the merged projects, so the old
// names stop existing everywhere (Home, Add, Reports, the slide). The old
// names' projectMeta and completion docs are deleted too, because a project is
// listed if any of the three sources mentions it. The merged project is always
// open (targets are active projects). Undo (8s) puts all of it back.
const normWord = w => w.toLowerCase().replace(/[^a-z0-9]/g, '');

// Names that look like one project split in two: earlier groups first, then
// names that start with the same word, e.g. "BMGE 2027" and "BMGE Digital plan".
function suggestMerges(names) {
  const STOP = new Set(['the', 'and', 'for', 'with', 'new', 'project', 'projects', 'team', 'plan', 'review', 'update', 'updates', 'weekly', 'monthly']);
  const out = [], used = new Set();
  const groups = new Map();
  names.forEach(n => { const g = legacyGroupOf(n); if (g) { if (!groups.has(g)) groups.set(g, []); groups.get(g).push(n); } });
  groups.forEach((list, g) => { if (list.length >= 2) { out.push({ name: g, names: list.sort((a, b) => a.localeCompare(b)) }); list.forEach(n => used.add(n)); } });
  const by = new Map();
  names.filter(n => !used.has(n)).forEach(n => {
    const w = normWord(n.trim().split(/\s+/)[0] || '');
    if (w.length < 3 || STOP.has(w)) return;
    if (!by.has(w)) by.set(w, []);
    by.get(w).push(n);
  });
  by.forEach(list => {
    if (list.length < 2) return;
    out.push({ name: defaultMergeName(list), names: list.sort((a, b) => a.localeCompare(b)) });
  });
  return out.sort((a, b) => b.names.length - a.names.length || a.name.localeCompare(b.name));
}
// the leading words the names share ("Townhall"), else the name with the most tasks
function defaultMergeName(list) {
  const split = list.map(n => n.trim().split(/\s+/));
  let k = 0;
  while (split.every(p => p[k] && normWord(p[k]) === normWord(split[0][k]))) k++;
  const common = split[0].slice(0, k).join(' ').replace(/[\s\-–—:|,\/]+$/, '');
  return common.length >= 3 ? common : biggest(list);
}

async function undoMerge(before, show) {
  const names = Object.keys(before.meta);
  try {
    const back = await Promise.allSettled(before.tasks.map(x => updateTask(x.id, { project: x.project })));
    if (back.some(r => r.status === 'rejected')) throw new Error('tasks');
    for (const n of names) {
      const k = keyFor(n);
      if (before.meta[n]) await setDoc(metaDoc(k), before.meta[n]); else await deleteDoc(metaDoc(k));
      const d = before.done[n];
      if (d) await setProjectComplete(n, d.completedMonth || localDateStr().slice(0, 7));
      else if (projectsData[k]) await reopenProject(n);
    }
  } catch (e) {
    console.error('Undo merge failed:', e);
    showNote('Could not undo the merge. Check your connection and try again.');
    return false;
  }
  before.tasks.forEach(x => { const t = allTasks.find(t => t.id === x.id); if (t) t.project = x.project; });
  names.forEach(n => {
    const k = keyFor(n);
    if (before.meta[n]) projectMeta[k] = before.meta[n]; else delete projectMeta[k];
    if (before.done[n]) projectsData[k] = before.done[n]; else delete projectsData[k];
  });
  activeProject = before.first;
  renderAll();
  if (show) showNote('Merge undone');
  return true;
}

// sources: names to combine; target: the name that remains (new or one of the sources).
// description / targetDate: pass to set them on the merged project, leave undefined to keep its own.
async function mergeProjects(sources, targetRaw, { description, targetDate } = {}) {
  const src = [...new Set(sources)];
  let target = String(targetRaw || '').trim();
  const same = src.find(n => n.toLowerCase() === target.toLowerCase());
  if (same) target = same;
  const gone = src.filter(n => n !== target);               // names that disappear
  const tk = keyFor(target);
  const moving = allTasks.filter(t => gone.includes(t.project));
  const involved = [...new Set([...src, target])];
  const before = {
    first: src[0],
    tasks: moving.map(t => ({ id: t.id, project: t.project })),
    meta: Object.fromEntries(involved.map(n => [n, projectMeta[keyFor(n)] ? { ...projectMeta[keyFor(n)] } : null])),
    done: Object.fromEntries(involved.map(n => [n, projectsData[keyFor(n)] ? { ...projectsData[keyFor(n)] } : null])),
  };

  // 1. the tasks. If any write fails the ones that went through are put back and nothing else happens.
  const res = await Promise.allSettled(moving.map(t => updateTask(t.id, { project: target })));
  if (res.some(r => r.status === 'rejected')) {
    const ok = new Set(moving.filter((_, i) => res[i].status === 'fulfilled').map(t => t.id));
    await Promise.allSettled(before.tasks.filter(x => ok.has(x.id)).map(x => updateTask(x.id, { project: x.project })));
    showNote('Could not merge the projects. Check your connection and try again.');
    return false;
  }

  // 2. the project's own details and completion
  const own = projectMeta[tk] || {};
  const meta = {
    name: target,
    description: description !== undefined ? description : (own.description || ''),
    targetDate: targetDate !== undefined ? targetDate : (own.targetDate || null),
    group: '',
  };
  try {
    await setDoc(metaDoc(tk), { ...meta, updatedAt: serverTimestamp(), ...(own.createdAt ? {} : { createdAt: serverTimestamp() }) }, { merge: true });
    await Promise.all(gone.map(n => deleteDoc(metaDoc(keyFor(n)))));
    for (const n of gone) if (projectsData[keyFor(n)]) await reopenProject(n);
  } catch (e) {
    console.error('Merge failed:', e);
    await undoMerge(before, false);
    showNote('Could not finish the merge, so nothing was changed.');
    return false;
  }

  moving.forEach(t => { t.project = target; });
  projectMeta[tk] = { ...own, ...meta };
  gone.forEach(n => { delete projectMeta[keyFor(n)]; delete projectsData[keyFor(n)]; });
  activeProject = target;
  renderAll();
  window.scrollTo({ top: 0, behavior: 'smooth' });
  haptic([10, 30, 10]);
  showUndo('Merged ' + plural(src.length, 'project', 'projects') + ' into “' + target + '”', () => undoMerge(before, false), 8000);
  return true;
}

// ── merge sheet (Merge in the sub row) ─────────────────────────────────────
const TICK = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
let org = null;      // { step: 'pick' | 'name', sel: Set(names), name, desc, target }
const activeNames = () => computeProjectList().filter(n => !projectsData[keyFor(n)]);
const mgRow = (name, on, kind) => `<button type="button" class="mg-row${on ? ' on' : ''}" role="${kind === 'radio' ? 'radio' : 'checkbox'}" aria-checked="${on}" data-name="${esc(name)}"><span class="mg-ck${kind === 'radio' ? ' r' : ''}">${TICK}</span><span class="mg-nm"><b>${esc(name)}</b><span>${plural(taskCount(name), 'task', 'tasks')}</span></span></button>`;

function organiseHTML() {
  const names = activeNames();
  if (names.length < 2) {
    return `<h2 class="wd-sheet-title">Merge projects</h2><div class="wd-empty"><b>Nothing to merge yet</b>You need at least two active projects. Create another one, or reopen a completed project.</div>`;
  }
  if (org.step === 'name') {
    const list = [...org.sel];
    return `<h2 class="wd-sheet-title">Merge ${list.length} projects</h2>
      <div class="prj-form">
        <div class="wd-lab">These move into one</div>
        <div class="mg-moves">${list.map(n => `<span>${esc(n)}</span>`).join('')}</div>
        <div class="wd-lab">New project name</div>
        <input class="wd-field" id="mg-name" maxlength="80" autocomplete="off" aria-label="New project name" value="${esc(org.name)}">
        <div class="wd-chips mg-use">${list.map(n => `<button type="button" class="wd-chip" data-use="${esc(n)}">${esc(n)}</button>`).join('')}</div>
        <div class="wd-lab">Description<span class="opt">optional</span></div>
        <textarea class="wd-field" id="mg-desc" rows="2" maxlength="240" placeholder="What is this project about?">${esc(org.desc)}</textarea>
        <div class="wd-lab">Target date<span class="opt">optional</span></div>
        <input type="date" class="wd-field" id="mg-target" aria-label="Target date" value="${esc(org.target)}">
        <p class="mg-sum" id="mg-sum"></p>
        <p class="wd-err" id="mg-err" role="alert" hidden></p>
        <button type="button" class="wd-btn p" id="mg-go">Merge ${list.length} projects</button>
        <button type="button" class="wd-btn s" id="mg-back">Back</button>
      </div>`;
  }
  const sug = suggestMerges(names).map((g, i) =>
    `<div class="prj-sug"><div class="sb"><b>${esc(g.name)}</b><span>${esc(plural(g.names.length, 'project', 'projects'))}, ${esc(plural(g.names.reduce((n, x) => n + taskCount(x), 0), 'task', 'tasks'))}</span></div><button type="button" class="wd-btn s" data-sug="${i}">Review</button></div>`).join('');
  const n = org.sel.size;
  return `<h2 class="wd-sheet-title">Merge projects</h2>
    <p class="wd-hint">Combine projects into one. Every task moves to the new name and you will see only that name everywhere.</p>
    ${sug ? `<div class="wd-lab">Suggested</div>${sug}` : ''}
    <div class="wd-lab">Tick the projects to merge</div>
    <div class="mg-list" role="group" aria-label="Projects to merge">${names.map(x => mgRow(x, org.sel.has(x), 'check')).join('')}</div>
    <div class="mg-bar"><button type="button" class="wd-btn p" id="mg-next"${n < 2 ? ' disabled' : ''}>${n < 2 ? 'Tick two or more projects' : 'Merge ' + n + ' projects'}</button></div>`;
}
function fillSummary() {
  const el = $('mg-sum'); if (!el) return;
  const name = ($('mg-name').value || '').trim();
  const n = allTasks.filter(t => org.sel.has(t.project) && t.project !== name).length;
  el.innerHTML = `<b>${plural(n, 'task', 'tasks')}</b> will be renamed${name ? ' to “' + esc(name) + '”' : ''}. Home, Add and Reports all use the new name. You can undo for 8 seconds after merging.`;
}
window.openOrganise = (preselect, suggestedName) => {
  const sel = new Set((Array.isArray(preselect) ? preselect : []).filter(n => activeNames().includes(n)));
  org = { step: 'pick', sel, name: suggestedName || '', desc: '', target: '' };
  const sheet = openSheet('prj-org', organiseHTML());
  const draw = () => { const top = sheet.scrollTop; sheet.innerHTML = '<div class="wd-grab"></div>' + organiseHTML(); sheet.scrollTop = top; if (org.step === 'name') fillSummary(); };
  const toName = (list, name) => {
    const big = biggest(list), m = metaOf(big);
    org.sel = new Set(list); org.step = 'name';
    org.name = name || defaultMergeName(list);
    org.desc = m.description || ''; org.target = m.targetDate || '';
    draw();
  };
  sheet.onclick = async e => {
    if (!org) return;
    const sug = e.target.closest('[data-sug]');
    if (sug) { const g = suggestMerges(activeNames())[+sug.dataset.sug]; if (g) toName(g.names, g.name); return; }
    const row = e.target.closest('.mg-row');
    if (row && org.step === 'pick') {
      const n = row.dataset.name;
      if (org.sel.has(n)) org.sel.delete(n); else org.sel.add(n);
      draw(); return;
    }
    if (e.target.closest('#mg-next')) { if (org.sel.size >= 2) toName([...org.sel], org.name); return; }
    const use = e.target.closest('[data-use]');
    if (use) { $('mg-name').value = use.dataset.use; fillSummary(); return; }
    if (e.target.closest('#mg-back')) { org.name = $('mg-name').value; org.desc = $('mg-desc').value; org.target = $('mg-target').value; org.step = 'pick'; draw(); return; }
    if (e.target.closest('#mg-go')) {
      const name = $('mg-name').value.trim();
      const err = $('mg-err');
      const fail = msg => { err.textContent = msg; err.hidden = false; $('mg-name').classList.add('bad'); $('mg-name').focus(); };
      if (!name) return fail('Enter a name for the merged project.');
      const clash = computeProjectList().find(n => n.toLowerCase() === name.toLowerCase() && !org.sel.has(n));
      if (clash) return fail('A project called “' + clash + '” already exists. Tick it too to merge into it.');
      const go = $('mg-go'), back = $('mg-back');
      go.disabled = back.disabled = true; go.textContent = 'Merging…';
      const ok = await mergeProjects([...org.sel], name, { description: $('mg-desc').value.trim(), targetDate: $('mg-target').value || null });
      if (ok) closeSheet('prj-org');
      else { go.disabled = back.disabled = false; go.textContent = 'Merge ' + org.sel.size + ' projects'; }
    }
  };
  sheet.oninput = e => {
    if (!org || org.step !== 'name') return;
    if (e.target.id === 'mg-name') { e.target.classList.remove('bad'); const err = $('mg-err'); if (err) err.hidden = true; fillSummary(); }
  };
  if (org.sel.size >= 2 && suggestedName) toName([...org.sel], suggestedName);
};

// ── merge into… (from one project's page) ──────────────────────────────────
window.openMergeInto = () => {
  const from = activeProject;
  if (!from) return;
  const first = n => normWord(n.trim().split(/\s+/)[0] || '');
  const sib = n => first(n).length >= 3 && first(n) === first(from);
  // projects that start with the same word come first and the biggest of them is pre-picked
  const targets = activeNames().filter(n => n !== from).sort((x, y) => (sib(y) - sib(x)) || x.localeCompare(y));
  if (!targets.length) { showNote('There is no other active project to merge into.'); return; }
  let pick = biggest(targets.filter(sib).length ? targets.filter(sib) : targets);
  const n = taskCount(from);
  const html = () => `<h2 class="wd-sheet-title">Merge “${esc(from)}”</h2>
    <p class="wd-hint">${n === 0 ? 'It has no tasks.' : n === 1 ? 'Its 1 task moves' : 'Its ' + n + ' tasks move'} into the project you pick. That project keeps its name.</p>
    <div class="wd-lab">Merge into</div>
    <div class="mg-list" role="radiogroup" aria-label="Merge into">${targets.map(x => mgRow(x, x === pick, 'radio')).join('')}</div>
    <div class="mg-bar"><button type="button" class="wd-btn p" id="mi-go">Merge into “${esc(pick)}”</button></div>`;
  const sheet = openSheet('prj-into', html());
  sheet.onclick = async e => {
    const row = e.target.closest('.mg-row');
    if (row) { pick = row.dataset.name; const top = sheet.scrollTop; sheet.innerHTML = '<div class="wd-grab"></div>' + html(); sheet.scrollTop = top; return; }
    if (e.target.closest('#mi-go')) {
      const go = $('mi-go'); go.disabled = true; go.textContent = 'Merging…';
      const ok = await mergeProjects([from, pick], pick);
      if (ok) closeSheet('prj-into'); else { go.disabled = false; go.textContent = 'Merge into “' + pick + '”'; }
    }
  };
};
