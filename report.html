  <!-- QUARTERLY -->
  <section class="rpt-panel on" id="panel-quarterly">
    <div class="rpt-ctl">
      <select class="wd-select" id="qr-quarter-sel" aria-label="Quarter" onchange="renderQuarterly()"></select>
      <select class="wd-select" id="qr-year-sel" aria-label="Year" onchange="renderQuarterly()"></select>
    </div>
    <div id="quarterly-content"><div class="wd-empty">Loading…</div></div>
  </section>

  <!-- MONTHLY -->
  <section class="rpt-panel" id="panel-monthly">
    <div id="month-host-monthly">
      <div class="rpt-ctl" id="ctl-month">
        <select class="wd-select" id="month-sel" aria-label="Month" onchange="loadReport()"></select>
        <button type="button" class="wd-chip" id="rpt-filter-btn" aria-expanded="false" aria-controls="filter-row-wrap" onclick="toggleRptFilters()">Filters<span class="n" id="filter-n"></span></button>
      </div>
    </div>
    <div class="rpt-filters" id="filter-row-wrap" hidden>
      <select class="wd-select" id="filter-project" aria-label="Project" onchange="applyFilters()"><option value="">All projects</option></select>
      <select class="wd-select" id="filter-member" aria-label="Member" onchange="applyFilters()"><option value="">All members</option></select>
      <select class="wd-select" id="filter-priority" aria-label="Priority" onchange="applyFilters()">
        <option value="">All priorities</option>
        <option value="critical">Critical</option>
        <option value="high">High</option>
        <option value="medium">Medium</option>
        <option value="low">Low</option>
      </select>
      <select class="wd-select" id="filter-status" aria-label="Status" onchange="applyFilters()">
        <option value="">All statuses</option>
        <option value="done">Done</option>
        <option value="inprog">In progress</option>
        <option value="todo">To do</option>
      </select>
      <div class="rpt-filters-foot"><span id="filter-count"></span><button type="button" class="wd-link" onclick="clearFilters()">Clear filters</button></div>
    </div>
    <div id="monthly-content"><div class="wd-empty">Loading…</div></div>
  </section>

  <!-- WEEKLY -->
  <section class="rpt-panel" id="panel-weekly">
    <div id="weekly-content"><div class="wd-empty">Loading…</div></div>
  </section>

  <!-- PERFORMANCE (one person or one project) -->
  <section class="rpt-panel" id="panel-myreport">
    <div class="wd-seg rpt-mode" role="group" aria-label="Report on">
      <button type="button" class="on" data-mode="member" onclick="setPerfMode('member',this)">By member</button>
      <button type="button" data-mode="project" onclick="setPerfMode('project',this)">By project</button>
    </div>
    <div class="rpt-ctl"><select class="wd-select block" id="my-report-member" aria-label="Member or project" onchange="renderMyReport()"></select></div>
    <div class="wd-seg four rpt-periods" role="group" aria-label="Period">
      <button type="button" data-period="week" onclick="setMyReportPeriod('week',this)">Last week</button>
      <button type="button" class="on" data-period="month" onclick="setMyReportPeriod('month',this)">This month</button>
      <button type="button" data-period="quarter" onclick="setMyReportPeriod('quarter',this)">Last quarter</button>
      <button type="button" data-period="overall" onclick="setMyReportPeriod('overall',this)">Overall</button>
    </div>
    <div id="month-host-perf"></div>
    <div id="my-report-content"><div class="wd-empty">Loading…</div></div>
  </section>
</div>

<script type="module">
import { onUserReady, getTasks, getMembers, getCalendarEvents, getProjects, setProjectComplete, reopenProject } from './js/firebase.js';
import { initShell } from './js/shell.js';
import { esc, initials, ICON, glyphSVG, STATUS_LABEL, ringHTML, openSheet, closeSheet, showNote, projHue } from './js/ui.js';

const $ = id => document.getElementById(id);
const toast = m => showNote(m);
window.closeSheet = closeSheet;

// ── STATE ──────────────────────────────────────────────────────────────────
let allTasks = [], allMembers = [], calendarEvents = {}, projectsData = {};
let selMonth = '';
let activeFilters = { project: '', member: '', priority: '', status: '' };
let filtersOpen = false;
let chartsOpen = false;
let chartInstances = {};
let myReportPeriod = 'month';
let perfMode = 'member';           // 'member' | 'project' — drives the Performance tab
let activeRptTab = 'quarterly';
let qrChartInstance = null;
let lastMonthly = [];              // the tasks behind the Monthly charts
let blockSeq = 0;

const MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
const pad = n => String(n).padStart(2, '0');
const PRIO = { critical: 'Critical', high: 'High', medium: 'Medium', low: 'Low' };
const CHEV = ICON.chevron.replace('width="22" height="22"', 'width="20" height="20"');

function fmtDate(d) { if (!d) return ''; const [y, m, day] = d.split('-'); return `${day} ${MONTHS[parseInt(m) - 1]}`; }
function monthLabel(m) { const [y, mo] = m.split('-'); return MONTHS[parseInt(mo) - 1] + ' ' + y; }

// ── SMALL BUILDING BLOCKS ──────────────────────────────────────────────────
const emptyHTML = (msg, sub = '') => `<div class="wd-empty">${esc(msg)}${sub ? '<br>' + esc(sub) : ''}</div>`;
const h2 = (t, n) => `<div class="rpt-h2"><span>${t}</span>${n != null && n !== '' ? `<span class="n">${n}</span>` : ''}</div>`;
const statsHTML = items => `<div class="rpt-stats c${items.length}">${items.map(([n, l, tr]) => `<div><b>${n}</b><span>${l}</span>${tr ? `<i>${tr}</i>` : ''}</div>`).join('')}</div>`;
const summaryHTML = (pct, title, sub) => `<div class="rpt-sum">${ringHTML(pct, 76, 6, pct + '%')}<div class="rs"><b>${title}</b><span>${sub}</span></div></div>`;
const bar = pct => `<span class="rpt-bar"><i style="width:${pct}%"></i></span>`;
const listHTML = inner => `<div class="rpt-list">${inner}</div>`;

function foldHTML(label, n, inner) {
  const id = 'fb' + (++blockSeq);
  return `<div class="rpt-fold"><button type="button" class="wd-disc" aria-expanded="false" aria-controls="${id}" onclick="toggleBlock(this)"><span>${label}</span><span class="n">${n}</span>${CHEV}</button><div id="${id}" class="rpt-fold-body" hidden>${inner}</div></div>`;
}
window.toggleBlock = (btn) => {
  const body = document.getElementById(btn.getAttribute('aria-controls'));
  if (!body) return;
  const open = body.hidden;
  body.hidden = !open;
  btn.setAttribute('aria-expanded', open);
};

function taskRowHTML(t) {
  const st = ['todo', 'inprog', 'onhold', 'done'].includes(t.status) ? t.status : 'todo';
  const members = (t.members || []).map(m => m.name).filter(Boolean).join(', ');
  const bits = [
    esc(STATUS_LABEL[st]),
    esc(PRIO[t.priority || 'medium']),
    t.project ? esc(t.project) : '',
    t.taskDueDate && st !== 'done' ? 'due ' + fmtDate(t.taskDueDate) : '',
    members ? 'with ' + esc(members) : '',
  ].filter(Boolean).join(' · ');
  return `<div class="rpt-task${st === 'done' ? ' is-done' : ''}"><span class="g" style="--proj:${projHue(t.project)}">${glyphSVG(st, 20)}</span><div><b>${esc(t.label)}</b><span>${bits}</span></div></div>`;
}

function memberRowHTML(name, text, pct) {
  return `<div class="rpt-member"><span class="wd-av sm quiet">${esc(initials(name))}</span><div class="rpt-member-b"><b>${esc(name)}</b>${bar(pct)}</div><span class="rpt-member-pct">${text}</span></div>`;
}

// a project (or contributor) as a row that opens to its tasks
function projectBlockHTML(name, tasks, doneCount, { complete = null } = {}) {
  const pct = tasks.length ? Math.round(doneCount / tasks.length * 100) : 0;
  const id = 'fb' + (++blockSeq);
  const act = complete === null ? '' : `<div class="rpt-pb-act"><button type="button" class="wd-btn s sm" data-proj="${esc(name)}" onclick="toggleProjectComplete(this.dataset.proj)">${complete ? 'Reopen project' : 'Mark project complete'}</button></div>`;
  return `<div class="rpt-project">
    <button type="button" class="rpt-project-hd" aria-expanded="false" aria-controls="${id}" onclick="toggleBlock(this)">
      <span class="rpt-project-name"><span class="nm">${esc(name)}${complete ? ' <span class="wd-tag">Complete</span>' : ''}</span>${bar(pct)}</span>
      <span class="rpt-project-pct">${pct}%</span>${CHEV}
    </button>
    <div id="${id}" class="rpt-project-body" hidden>${act}${tasks.map(taskRowHTML).join('')}</div>
  </div>`;
}

// ── MONTH SELECTOR + SHARED CONTROLS ───────────────────────────────────────
(function initMonths() {
  const sel = $('month-sel');
  const now = new Date();
  let opts = '';
  for (let i = 0; i < 12; i++) {
    const d = new Date(now.getFullYear(), now.getMonth() - i, 1);
    opts += `<option value="${d.getFullYear()}-${pad(d.getMonth() + 1)}"${i === 0 ? ' selected' : ''}>${MONTHS[d.getMonth()]} ${d.getFullYear()}</option>`;
  }
  sel.innerHTML = opts;
  selMonth = sel.value;
})();

function getCurrentQuarter() { return Math.floor(new Date().getMonth() / 3) + 1; }
(function initQuarterSelectors() {
  const qSel = $('qr-quarter-sel'), ySel = $('qr-year-sel');
  qSel.innerHTML = [1, 2, 3, 4].map(q => `<option value="${q}"${q === getCurrentQuarter() ? ' selected' : ''}>Q${q} (${['Jan–Mar', 'Apr–Jun', 'Jul–Sep', 'Oct–Dec'][q - 1]})</option>`).join('');
  const curY = new Date().getFullYear();
  let y = '';
  for (let i = curY; i >= curY - 2; i--) y += `<option value="${i}"${i === curY ? ' selected' : ''}>${i}</option>`;
  ySel.innerHTML = y;
})();

window.loadReport = () => { selMonth = $('month-sel').value; renderActiveTab(); };

function syncControls() {
  const ctl = $('ctl-month');
  const showMonth = activeRptTab === 'monthly' || (activeRptTab === 'myreport' && myReportPeriod === 'month');
  if (activeRptTab === 'monthly') $('month-host-monthly').appendChild(ctl);
  else $('month-host-perf').appendChild(ctl);
  ctl.hidden = !showMonth;
  $('rpt-filter-btn').hidden = activeRptTab !== 'monthly';
  $('filter-row-wrap').hidden = !(activeRptTab === 'monthly' && filtersOpen);
}

function renderActiveTab() {
  if (activeRptTab === 'monthly') renderMonthly();
  if (activeRptTab === 'myreport') renderMyReport();
  if (activeRptTab === 'weekly') renderWeekly();
  if (activeRptTab === 'quarterly') renderQuarterly();
}

window.switchRptTab = (tab) => {
  activeRptTab = tab;
  document.querySelectorAll('.rpt-tabs button').forEach(b => {
    const on = b.id === 'tab-' + tab;
    b.classList.toggle('on', on); b.setAttribute('aria-selected', on);
  });
  document.querySelectorAll('.rpt-panel').forEach(p => p.classList.toggle('on', p.id === 'panel-' + tab));
  syncControls();
  renderActiveTab();
};

onUserReady(async () => {
  try {
    [allTasks, allMembers, calendarEvents, projectsData] = await Promise.all([getTasks(), getMembers(), getCalendarEvents(), getProjects()]);
  } catch (e) {
    console.error('Report load failed:', e);
    const msg = emptyHTML('Could not load the report.', 'Check your connection and reload.');
    ['quarterly-content', 'monthly-content', 'weekly-content', 'my-report-content'].forEach(id => { $(id).innerHTML = msg; });
    return;
  }
  populateMemberSelector();
  renderActiveTab();
});

// ── UTILS ──────────────────────────────────────────────────────────────────
function isProjectCompleted(projName, month) {
  // A project is hidden if it was completed in a PREVIOUS month
  const p = projectsData[btoa(projName)];
  if (!p || !p.completedMonth) return false;
  return p.completedMonth < month; // hide only from months AFTER completion
}
function isProjectCompletedForMonth(projName, month) {
  const p = projectsData[btoa(projName)];
  if (!p) return false;
  return !!p.completedMonth;
}

// ── FILTERS (Monthly) ──────────────────────────────────────────────────────
window.toggleRptFilters = () => {
  filtersOpen = !filtersOpen;
  $('filter-row-wrap').hidden = !filtersOpen;
  $('rpt-filter-btn').setAttribute('aria-expanded', filtersOpen);
};
window.applyFilters = () => {
  activeFilters.project = $('filter-project')?.value || '';
  activeFilters.member = $('filter-member')?.value || '';
  activeFilters.priority = $('filter-priority')?.value || '';
  activeFilters.status = $('filter-status')?.value || '';
  renderMonthly();
};
window.clearFilters = () => {
  ['filter-project', 'filter-member', 'filter-priority', 'filter-status'].forEach(id => { const el = $(id); if (el) el.value = ''; });
  activeFilters = { project: '', member: '', priority: '', status: '' };
  renderMonthly();
};
function applyActiveFilters(tasks) {
  let r = [...tasks];
  if (activeFilters.project) r = r.filter(t => (t.project || '') === activeFilters.project);
  if (activeFilters.member) r = r.filter(t => (t.members || []).some(m => m.name === activeFilters.member));
  if (activeFilters.priority) r = r.filter(t => t.priority === activeFilters.priority);
  if (activeFilters.status) r = r.filter(t => t.status === activeFilters.status);
  return r;
}
function populateFilterDropdowns(mt) {
  const pSel = $('filter-project');
  if (pSel) {
    const projects = [...new Set(mt.map(t => t.project).filter(Boolean))].sort();
    const cur = pSel.value;
    pSel.innerHTML = '<option value="">All projects</option>' + projects.map(p => `<option value="${esc(p)}"${cur === p ? ' selected' : ''}>${esc(p)}</option>`).join('');
  }
  const mSel = $('filter-member');
  if (mSel) {
    const names = [...new Set(mt.flatMap(t => (t.members || []).map(m => m.name)))].sort();
    const cur = mSel.value;
    mSel.innerHTML = '<option value="">All members</option>' + names.map(n => `<option value="${esc(n)}"${cur === n ? ' selected' : ''}>${esc(n)}</option>`).join('');
  }
  const filtered = applyActiveFilters(mt);
  const nActive = Object.values(activeFilters).filter(Boolean).length;
  $('filter-n').textContent = nActive ? nActive : '';
  $('filter-count').textContent = nActive ? `Showing ${filtered.length} of ${mt.length}` : '';
}

// ── CHARTS ─────────────────────────────────────────────────────────────────
// A single ink ramp, read from the active skin: strongest to faintest.
const cssv = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
function chartTheme() {
  return { ink: cssv('--text'), mid: cssv('--text2'), soft: cssv('--border2'), faint: cssv('--bg3'), paper: cssv('--bg'), grid: cssv('--border'), family: cssv('--sans') || 'system-ui, sans-serif' };
}
function destroyCharts() {
  Object.values(chartInstances).forEach(ch => { try { ch.destroy(); } catch (e) {} });
  chartInstances = {};
}
function renderCharts(mt) {
  destroyCharts();
  if (!mt.length || !window.Chart) return;
  const c = chartTheme();
  const font = { size: 11, family: c.family };
  const base = { animation: false, responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } } };
  const legend = { display: true, position: 'bottom', labels: { font, color: c.mid, boxWidth: 10, padding: 8 } };
  const axes = { x: { ticks: { font, color: c.mid }, grid: { display: false } }, y: { ticks: { font, color: c.mid, precision: 0 }, grid: { color: c.grid }, beginAtZero: true } };
  const stacked = { x: { ...axes.x, stacked: true }, y: { ...axes.y, stacked: true } };
  const make = (key, id, cfg) => { const el = $(id); if (!el) return; try { chartInstances[key] = new Chart(el, cfg); } catch (e) {} };

  make('status', 'chart-status', {
    type: 'doughnut',
    data: { labels: ['Done', 'In progress', 'On hold', 'To do'], datasets: [{
      data: ['done', 'inprog', 'onhold', 'todo'].map(s => mt.filter(t => t.status === s).length),
      backgroundColor: [c.ink, c.mid, c.soft, c.faint], borderColor: c.paper, borderWidth: 2, hoverOffset: 3,
    }] },
    options: { ...base, plugins: { legend } },
  });
  make('priority', 'chart-priority', {
    type: 'bar',
    data: { labels: ['Critical', 'High', 'Medium', 'Low'], datasets: [{
      data: ['critical', 'high', 'medium', 'low'].map(p => mt.filter(t => t.priority === p).length),
      backgroundColor: [c.ink, c.mid, c.mid, c.soft], borderRadius: 4, borderWidth: 0,
    }] },
    options: { ...base, scales: axes },
  });

  const memberMap = {};
  mt.forEach(t => (t.members || []).forEach(m => {
    if (!memberMap[m.name]) memberMap[m.name] = { done: 0, total: 0 };
    memberMap[m.name].total++;
    if (((t.memberStatus || {})[m.id] || t.status) === 'done') memberMap[m.name].done++;
  }));
  const mNames = Object.keys(memberMap).sort();
  make('member', 'chart-member', {
    type: 'bar',
    data: { labels: mNames.map(n => n.split(' ')[0]), datasets: [
      { label: 'Done', data: mNames.map(n => memberMap[n].done), backgroundColor: c.ink, borderRadius: 3, borderWidth: 0 },
      { label: 'Open', data: mNames.map(n => memberMap[n].total - memberMap[n].done), backgroundColor: c.soft, borderRadius: 3, borderWidth: 0 },
    ] },
    options: { ...base, scales: stacked, plugins: { legend } },
  });

  const projMap = {};
  mt.forEach(t => { const p = t.project || '(none)'; if (!projMap[p]) projMap[p] = { done: 0, total: 0 }; projMap[p].total++; if (t.status === 'done') projMap[p].done++; });
  const pNames = Object.keys(projMap).filter(p => p !== '(none)').sort();
  if (pNames.length) {
    make('project', 'chart-project', {
      type: 'bar',
      data: { labels: pNames.map(n => n.length > 12 ? n.slice(0, 11) + '…' : n), datasets: [
        { label: 'Done', data: pNames.map(n => projMap[n].done), backgroundColor: c.ink, borderRadius: 3, borderWidth: 0 },
        { label: 'Open', data: pNames.map(n => projMap[n].total - projMap[n].done), backgroundColor: c.soft, borderRadius: 3, borderWidth: 0 },
      ] },
      options: { ...base, scales: stacked, plugins: { legend } },
    });
  }
}
window.toggleCharts = (btn) => {
  chartsOpen = !chartsOpen;
  $('charts-body').hidden = !chartsOpen;
  btn.setAttribute('aria-expanded', chartsOpen);
  if (chartsOpen) renderCharts(lastMonthly);
};

// ── MONTHLY ────────────────────────────────────────────────────────────────
function renderMonthly() {
  // exclude projects completed in a prior month
  const allMt = allTasks.filter(t => {
    if (t.month !== selMonth) return false;
    if ((t.taskType || 'mbc') !== 'mbc') return false;
    if (t.project && isProjectCompleted(t.project, selMonth)) return false;
    return true;
  });
  populateFilterDropdowns(allMt);
  const mt = applyActiveFilters(allMt);
  const el = $('monthly-content');
  lastMonthly = mt;

  if (!allMt.length) { destroyCharts(); el.innerHTML = emptyHTML('No tasks for ' + monthLabel(selMonth), 'Pick another month above.'); return; }
  if (!mt.length) { destroyCharts(); el.innerHTML = emptyHTML('No tasks match these filters.', 'Clear the filters to see all ' + allMt.length + ' tasks.'); return; }

  const total = mt.length, done = mt.filter(t => t.status === 'done').length;
  const inprog = mt.filter(t => t.status === 'inprog').length;
  const critOpen = mt.filter(t => t.priority === 'critical' && t.status !== 'done');
  const pct = total ? Math.round(done / total * 100) : 0;

  const byProj = {};
  mt.forEach(t => { const p = t.project || ''; (byProj[p] ||= []).push(t); });
  const namedProjs = Object.keys(byProj).filter(Boolean).sort((a, b) => a.localeCompare(b));
  const noProj = byProj[''] || [];

  const shipped = mt.filter(t => t.status === 'done');
  const carry = mt.filter(t => t.status !== 'done' && t.priority !== 'critical');

  const memberRows = allMembers.map(m => {
    const mTasks = allMt.filter(t => (t.members || []).some(mm => mm.name && mm.name.toLowerCase() === m.name.toLowerCase()));
    if (!mTasks.length) return '';
    const mDone = mTasks.filter(t => {
      const mid = (t.members || []).find(mm => mm.name && mm.name.toLowerCase() === m.name.toLowerCase())?.id;
      return mid ? (t.memberStatus || {})[mid] === 'done' : t.status === 'done';
    }).length;
    const mp = Math.round(mDone / mTasks.length * 100);
    return memberRowHTML(m.name, mp + '%', mp);
  }).join('');

  const hasProjChart = namedProjs.length > 0;
  el.innerHTML = `
    ${summaryHTML(pct, pct + '% complete', `${done} of ${total} tasks done in ${monthLabel(selMonth)}`)}
    ${statsHTML([[total, 'Tasks'], [done, 'Done'], [inprog, 'In progress'], [critOpen.length, 'Critical open']])}

    <div class="rpt-fold"><button type="button" class="wd-disc" id="charts-toggle" aria-expanded="${chartsOpen}" aria-controls="charts-body" onclick="toggleCharts(this)"><span>Charts</span><span class="n">${hasProjChart ? 4 : 3}</span>${CHEV}</button>
      <div class="rpt-charts" id="charts-body"${chartsOpen ? '' : ' hidden'}>
        <div class="rpt-chart"><div class="rpt-chart-t">Status</div><div class="rpt-chart-wrap"><canvas id="chart-status"></canvas></div></div>
        <div class="rpt-chart"><div class="rpt-chart-t">Priority</div><div class="rpt-chart-wrap"><canvas id="chart-priority"></canvas></div></div>
        <div class="rpt-chart"><div class="rpt-chart-t">By member</div><div class="rpt-chart-wrap"><canvas id="chart-member"></canvas></div></div>
        ${hasProjChart ? '<div class="rpt-chart"><div class="rpt-chart-t">By project</div><div class="rpt-chart-wrap"><canvas id="chart-project"></canvas></div></div>' : ''}
      </div></div>

    ${namedProjs.length ? h2('Projects', namedProjs.length) + listHTML(namedProjs.map(p => projectBlockHTML(p, byProj[p], byProj[p].filter(t => t.status === 'done').length, { complete: isProjectCompletedForMonth(p, selMonth) })).join('')) : ''}
    ${noProj.length ? foldHTML('Tasks without a project', noProj.length, listHTML(noProj.map(taskRowHTML).join(''))) : ''}
    ${critOpen.length ? h2('Critical and still open', critOpen.length) + listHTML(critOpen.map(taskRowHTML).join('')) : ''}
    ${shipped.length ? foldHTML('What we shipped', shipped.length, listHTML(shipped.map(taskRowHTML).join(''))) : ''}
    ${carry.length ? foldHTML('Carry-forward', carry.length, listHTML(carry.map(taskRowHTML).join(''))) : ''}
    ${memberRows ? h2('By member') + listHTML(memberRows) : ''}
  `;
  if (chartsOpen) setTimeout(() => renderCharts(mt), 30);
  else destroyCharts();
}
window.renderMonthly = renderMonthly;

window.toggleProjectComplete = async (projName) => {
  const isComp = isProjectCompletedForMonth(projName, selMonth);
  try {
    if (isComp) {
      await reopenProject(projName);
      delete projectsData[btoa(projName)];
    } else {
      await setProjectComplete(projName, selMonth);
      projectsData[btoa(projName)] = { name: projName, completedMonth: selMonth };
    }
    showNote(isComp ? 'Project reopened' : 'Marked complete');
  } catch (e) { showNote('Could not update the project. Try again.'); }
  renderMonthly();
};

// ── PERFORMANCE (one person, or one project) ───────────────────────────────
function populateMemberSelector() {
  const sel = $('my-report-member');
  if (perfMode === 'project') {
    const projects = [...new Set(allTasks.map(t => t.project).filter(Boolean))].sort();
    sel.innerHTML = projects.map(p => `<option value="${esc(p)}">${esc(p)}</option>`).join('');
    return;
  }
  const myName = localStorage.getItem('wd_myname') || '';
  const isAdmin = myName.toLowerCase() === 'harshit';
  const viewable = isAdmin ? allMembers : allMembers.filter(m => m.name.toLowerCase() === myName.toLowerCase());
  sel.innerHTML = viewable.map(m => `<option value="${m.id}"${m.name.toLowerCase() === myName.toLowerCase() ? ' selected' : ''}>${esc(m.name)}</option>`).join('');
}

window.setPerfMode = (mode, btn) => {
  perfMode = mode;
  document.querySelectorAll('.rpt-mode button').forEach(b => b.classList.toggle('on', b.dataset.mode === mode));
  populateMemberSelector();
  renderMyReport();
};
window.setMyReportPeriod = (period, btn) => {
  myReportPeriod = period;
  document.querySelectorAll('.rpt-periods button').forEach(b => b.classList.toggle('on', b.dataset.period === period));
  syncControls();
  renderMyReport();
};

function getMyReportTasks(id){
  const now=new Date();

  // ── PROJECT MODE: id is the project name itself, not a member id ──
  if(perfMode==='project'){
    const isMine=t=>(t.project||'')===id;
    if(myReportPeriod==='week'){
      const cutoff=new Date(now); cutoff.setDate(cutoff.getDate()-7);
      return allTasks.filter(t=>{
        if(!isMine(t)) return false;
        if(t.status!=='done') return true;
        const ca=t.completedAt?(t.completedAt.toDate?t.completedAt.toDate():new Date(t.completedAt)):null;
        const cr=t.createdAt?(t.createdAt.toDate?t.createdAt.toDate():new Date(t.createdAt)):null;
        return (ca&&ca>=cutoff)||(cr&&cr>=cutoff);
      });
    } else if(myReportPeriod==='quarter'){
      const months=[];
      for(let i=0;i<3;i++){const d=new Date(now.getFullYear(),now.getMonth()-i,1);months.push(`${d.getFullYear()}-${pad(d.getMonth()+1)}`);}
      return allTasks.filter(t=>isMine(t)&&months.includes(t.month));
    } else if(myReportPeriod==='overall'){
      return allTasks.filter(isMine);
    } else {
      return allTasks.filter(t=>t.month===selMonth&&isMine(t));
    }
  }

  // ── MEMBER MODE (original behaviour) ──
  const memberObj=allMembers.find(m=>m.id===id);
  const memberName=memberObj?memberObj.name.toLowerCase():'';
  const isMine=t=>memberName
    ?(t.members||[]).some(m=>m.name&&m.name.toLowerCase()===memberName)
    :(t.members||[]).some(m=>m.id===id);

  if(myReportPeriod==='week'){
    const cutoff=new Date(now); cutoff.setDate(cutoff.getDate()-7);
    return allTasks.filter(t=>{
      if(!isMine(t)) return false;
      if(t.status!=='done') return true;
      const ca=t.completedAt?(t.completedAt.toDate?t.completedAt.toDate():new Date(t.completedAt)):null;
      const cr=t.createdAt?(t.createdAt.toDate?t.createdAt.toDate():new Date(t.createdAt)):null;
      return (ca&&ca>=cutoff)||(cr&&cr>=cutoff);
    });
  } else if(myReportPeriod==='quarter'){
    const months=[];
    for(let i=0;i<3;i++){const d=new Date(now.getFullYear(),now.getMonth()-i,1);months.push(`${d.getFullYear()}-${pad(d.getMonth()+1)}`);}
    return allTasks.filter(t=>isMine(t)&&months.includes(t.month));
  } else if(myReportPeriod==='overall'){
    return allTasks.filter(isMine);
  } else {
    return allTasks.filter(t=>t.month===selMonth&&isMine(t));
  }
}

function getPeriodLabel(){
  if(myReportPeriod==='week') return 'Last 7 Days';
  if(myReportPeriod==='quarter') return 'Last Quarter (3 months)';
  if(myReportPeriod==='overall') return 'All Time';
  return monthLabel(selMonth);
}

// Completion check that respects per-member status on shared tasks
// (t.memberStatus) when it exists, falling back to the task's own status.
function isDoneForMember(t, memberName){
  const mid=(t.members||[]).find(m=>m.name&&m.name.toLowerCase()===memberName.toLowerCase())?.id;
  return mid?(t.memberStatus||{})[mid]==='done':t.status==='done';
}

// ── WEEKLY ─────────────────────────────────────────────────────────────────
function renderWeekly() {
  const now = new Date();
  const monday = new Date(now); monday.setDate(now.getDate() - ((now.getDay() + 6) % 7));
  const toStr = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  const mondayStr = toStr(monday), todayStr = toStr(now);

  const weekTasks = allTasks.filter(t => {
    if ((t.taskType || 'mbc') !== 'mbc') return false;
    const cr = t.createdAt ? (t.createdAt.toDate ? t.createdAt.toDate() : new Date(t.createdAt)) : null;
    const ca = t.completedAt ? (t.completedAt.toDate ? t.completedAt.toDate() : new Date(t.completedAt)) : null;
    if (t.status !== 'done') return true;
    return (ca && toStr(ca) >= mondayStr) || (cr && toStr(cr) >= mondayStr);
  });
  const done = weekTasks.filter(t => t.status === 'done');
  const inprog = weekTasks.filter(t => t.status === 'inprog');
  const todo = weekTasks.filter(t => t.status === 'todo');

  const memberStats = {};
  weekTasks.forEach(t => (t.members || []).forEach(m => {
    if (!memberStats[m.name]) memberStats[m.name] = { done: 0, total: 0 };
    memberStats[m.name].total++;
    if (((t.memberStatus || {})[m.id] || t.status) === 'done') memberStats[m.name].done++;
  }));

  const weekLabel = `Mon ${fmtDate(mondayStr)} to ${fmtDate(todayStr)}`;
  const teamRows = Object.entries(memberStats).sort((a, b) => b[1].done - a[1].done)
    .map(([name, s]) => memberRowHTML(name, `${s.done}/${s.total}`, s.total ? Math.round(s.done / s.total * 100) : 0)).join('');

  $('weekly-content').innerHTML = `
    ${summaryHTML(weekTasks.length ? Math.round(done.length / weekTasks.length * 100) : 0, 'This week', esc(weekLabel))}
    ${statsHTML([[done.length, 'Done'], [inprog.length, 'In progress'], [todo.length, 'To do']])}
    ${h2('Completed this week', done.length)}
    ${done.length ? listHTML(done.map(taskRowHTML).join('')) : emptyHTML('Nothing completed yet this week.')}
    ${inprog.length ? h2('In progress', inprog.length) + listHTML(inprog.map(taskRowHTML).join('')) : ''}
    ${teamRows ? h2('Team this week') + listHTML(teamRows) : ''}
  `;
  window._weekDigestData = { done, inprog, memberStats, weekLabel };
}
window.renderWeekly = renderWeekly;

window.copyWeeklyDigest = async () => {
  const d = window._weekDigestData;
  if (!d) { toast('Nothing to copy yet'); return; }
  const nl = '\n';
  const doneTxt = d.done.map(t => '  • ' + t.label + (t.members?.length ? ' (' + t.members.map(m => m.name).join(', ') + ')' : '')).join(nl) || '  None';
  const inpTxt = d.inprog.map(t => '  • ' + t.label).join(nl) || '  None';
  const memTxt = Object.entries(d.memberStats).sort((a, b) => b[1].done - a[1].done).map(([n, s]) => '  ' + n + ': ' + s.done + '/' + s.total).join(nl) || '  None';
  const txt = '📊 WorkDesk Weekly Digest' + nl + d.weekLabel + nl + nl + '✅ Completed (' + d.done.length + '):' + nl + doneTxt + nl + nl + '🔄 In Progress (' + d.inprog.length + '):' + nl + inpTxt + nl + nl + '👥 Team:' + nl + memTxt;
  try { await navigator.clipboard.writeText(txt); toast('Digest copied. Paste it anywhere.'); }

};

window.exportPDF=()=>{

  const lbl = monthLabel(selMonth);
  const total = mt.length;
  const done  = mt.filter(t=>t.status==='done').length;
  const inprog = mt.filter(t=>t.status==='inprog').length;
  const todoC  = mt.filter(t=>t.status==='todo').length;
  const crit   = mt.filter(t=>t.priority==='critical'&&t.status!=='done').length;
  const pct    = total ? Math.round(done/total*100) : 0;
  const pc     = pct>=80?'#34c759':pct>=50?'#ff9f0a':'#dc2626';

  // Group by project, sort: named projects first, then no-project
  const byProj = {};
  mt.forEach(t => {
    const p = t.project || '— No Project —';
    if (!byProj[p]) byProj[p] = [];
    byProj[p].push(t);
  });
  const projKeys = Object.keys(byProj).sort((a,b) => {
    if (a==='— No Project —') return 1;
    if (b==='— No Project —') return -1;
    return a.localeCompare(b);
  });

  // Sort tasks within each project: done first (by completedAt desc), then inprog, then todo
  function sortTasks(tasks) {
    return [...tasks].sort((a,b) => {
      const order = {done:0, inprog:1, todo:2};
      const ao = order[a.status]??2, bo = order[b.status]??2;
      if (ao !== bo) return ao - bo;
      if (a.status === 'done') {
        const ca = a.completedAt?.toDate ? a.completedAt.toDate() : new Date(a.completedAt||0);
        const cb = b.completedAt?.toDate ? b.completedAt.toDate() : new Date(b.completedAt||0);
        return cb - ca; // most recently done first

      return 0;

  function statusBadge(s) {

// ── QUARTERLY ──────────────────────────────────────────────────────────────
// Everything here is derived from the data already loaded for the other tabs.
// A task belongs to a quarter if its `.month` falls in that quarter's three
// months, and only team (mbc) tasks count toward the team stats.
function getQuarterMonths(year,q){
  const startMonth=(q-1)*3; // Q1->Jan(0), Q2->Apr(3), Q3->Jul(6), Q4->Oct(9)
  return [0,1,2].map(i=>`${year}-${pad(startMonth+i+1)}`);
}
function getPrevQuarter(year,q){
  return q===1 ? {year:year-1,q:4} : {year,q:q-1};
}
function getQuarterTasksFor(year,q){
  const months=getQuarterMonths(year,q);
  return allTasks.filter(t=>months.includes(t.month)&&(t.taskType||'mbc')==='mbc');
}

function computeQuarterStats(qt,year,q){
  const months=getQuarterMonths(year,q);
  const total=qt.length;
  const doneTasks=qt.filter(t=>t.status==='done');
  const done=doneTasks.length;
  const pct=total?Math.round(done/total*100):0;

  // On-time delivery: of DONE tasks that had a due date, how many were
  // completed on or before it. Tasks with no due date are excluded from
  // this specific rate (there's nothing to be "on time" against).
  const withDue=doneTasks.filter(t=>t.taskDueDate);
  const onTime=withDue.filter(t=>{
    const ca=t.completedAt?(t.completedAt.toDate?t.completedAt.toDate():new Date(t.completedAt)):null;
    if(!ca) return false;
    return ca<=new Date(t.taskDueDate+'T23:59:59');
  }).length;
  const onTimeRate=withDue.length?Math.round(onTime/withDue.length*100):null;

  const critResolved=doneTasks.filter(t=>t.priority==='critical').length;
  const critOpen=qt.filter(t=>t.priority==='critical'&&t.status!=='done').length;

  const projectNames=[...new Set(qt.map(t=>t.project).filter(Boolean))];
  const projectsCompletedThisQ=projectNames.filter(p=>{
    const pd=projectsData[btoa(p)];
    return pd&&pd.completedMonth&&months.includes(pd.completedMonth);
  }).length;

  // Leaderboard — one row per person who appears on at least one task this
  // quarter. Sorted by tasks DONE (a clearer, less gameable headline number
  // than raw %, which a 1/1 task person would otherwise "win" on).
  const memberAgg={};
  qt.forEach(t=>{
    (t.members||[]).forEach(m=>{
      if(!m.name) return;
      const k=m.name;
      (memberAgg[k]||=({name:m.name,total:0,done:0})).total++;
      if(isDoneForMember(t,m.name)) memberAgg[k].done++;
    });
  });
  const leaderboard=Object.values(memberAgg)
    .map(m=>({...m,pct:m.total?Math.round(m.done/m.total*100):0}))
    .sort((a,b)=>b.done-a.done||b.pct-a.pct);

  // Project spotlight — completed projects first (celebrate wins), then by
  // completion % descending.
  const projAgg={};
  qt.forEach(t=>{
    const p=t.project; if(!p) return;
    (projAgg[p]||=({name:p,total:0,done:0})).total++;
    if(t.status==='done') projAgg[p].done++;
  });
  const projectSpotlight=Object.values(projAgg).map(p=>{
    const pd=projectsData[btoa(p.name)];
    const completed=!!(pd&&pd.completedMonth&&months.includes(pd.completedMonth));
    return {...p,pct:p.total?Math.round(p.done/p.total*100):0,completed};
  }).sort((a,b)=>(b.completed-a.completed)||(b.pct-a.pct)||(b.total-a.total));

  // Trend — done-task count per month within the quarter, for the bar chart.
  const monthlyTrend=months.map(m=>({
    month:m,
    label:MONTHS[parseInt(m.split('-')[1])-1],
    done:qt.filter(t=>t.month===m&&t.status==='done').length,
  }));

  return {total,done,pct,onTimeRate,critResolved,critOpen,
    projectCount:projectNames.length,projectsCompletedThisQ,
    leaderboard,projectSpotlight,monthlyTrend,months};
}

function generateHeadline(stats,prevStats,lbl){
  let trend='';
  if(prevStats.done>0){
    const chg=Math.round((stats.done-prevStats.done)/prevStats.done*100);
    if(chg>0) trend=`, up <b>${chg}%</b> from last quarter`;
    else if(chg<0) trend=`, down ${Math.abs(chg)}% from last quarter`;
    else trend=`, matching last quarter's pace`;
  } else if(stats.done>0){
    trend=' — no prior-quarter baseline to compare against';
  }
  const otSentence=stats.onTimeRate!==null
    ? `<b>${stats.onTimeRate}%</b> of completed tasks were delivered on or before their due date.`
    : `No due dates were tracked on completed tasks this quarter.`;
  return `The team completed <b>${stats.done}</b> task${stats.done===1?'':'s'} across <b>${stats.projectCount}</b> project${stats.projectCount===1?'':'s'} in ${lbl}${trend}. ${otSentence}${stats.critResolved?` <b>${stats.critResolved}</b> critical issue${stats.critResolved===1?'':'s'} ${stats.critResolved===1?'was':'were'} resolved.`:''}`;
}

function qrGetSelection(){
  const q=parseInt(document.getElementById('qr-quarter-sel').value,10);
  const year=parseInt(document.getElementById('qr-year-sel').value,10);
  return {q,year};
}


window.renderQuarterly = () => {
  const { q, year } = qrGetSelection();
  const lbl = `Q${q} ${year}`;
  const qt = getQuarterTasksFor(year, q);
  const stats = computeQuarterStats(qt, year, q);
  const prev = getPrevQuarter(year, q);
  const prevQt = getQuarterTasksFor(prev.year, prev.q);
  const prevStats = computeQuarterStats(prevQt, prev.year, prev.q);
  const el = $('quarterly-content');

  if (qrChartInstance) { try { qrChartInstance.destroy(); } catch (e) {} qrChartInstance = null; }
  if (!qt.length) { el.innerHTML = emptyHTML(`No tasks logged for ${lbl} yet`, 'They show up here once tasks are added to a month in this quarter.'); return; }

  const doneTrend = prevStats.done > 0 ? Math.round((stats.done - prevStats.done) / prevStats.done * 100) : null;
  const pctTrend = prevStats.total > 0 ? stats.pct - prevStats.pct : null;
  const trendTxt = (v, unit) => v === null ? '' : (v >= 0 ? 'Up ' : 'Down ') + Math.abs(v) + unit + ' on last quarter';

  el.innerHTML = `
    <p class="rpt-lead">${generateHeadline(stats, prevStats, lbl)}</p>
    ${statsHTML([
      [stats.done, 'Tasks completed', trendTxt(doneTrend, '%')],
      [stats.pct + '%', 'Completion rate', trendTxt(pctTrend, ' pts')],
      [stats.onTimeRate !== null ? stats.onTimeRate + '%' : '–', 'Delivered on time'],
      [stats.critResolved, 'Critical resolved', stats.critOpen ? stats.critOpen + ' still open' : ''],
    ]).replace('rpt-stats c4', 'rpt-stats c4 q')}

    ${h2('Monthly momentum', 'Tasks done')}
    <div class="rpt-chart solo"><div class="rpt-chart-wrap"><canvas id="qr-trend-chart"></canvas></div></div>

    ${h2('Top performers', stats.leaderboard.length + (stats.leaderboard.length === 1 ? ' contributor' : ' contributors'))}
    ${listHTML(stats.leaderboard.slice(0, 8).map((m, i) => `<div class="rpt-lb"><span class="rk${i < 3 ? ' top' : ''}">${i + 1}</span><div class="rpt-lb-b"><b>${esc(m.name)}</b><span>${m.done} of ${m.total} tasks done</span>${bar(m.pct)}</div><span class="rpt-lb-pct">${m.pct}%</span></div>`).join(''))}

    ${h2('Project spotlight', `${stats.projectsCompletedThisQ} of ${stats.projectCount} shipped`)}
    ${listHTML(stats.projectSpotlight.map(p => `<div class="rpt-lb"><div class="rpt-lb-b"><b>${esc(p.name)}${p.completed ? ' <span class="wd-tag">Shipped</span>' : ''}</b><span>${p.done} of ${p.total} tasks complete</span>${bar(p.pct)}</div><span class="rpt-lb-pct">${p.pct}%</span></div>`).join(''))}
  `;

  const ctx = $('qr-trend-chart');
  if (ctx && window.Chart) {
    const c = chartTheme();
    const font = { size: 11, family: c.family };
    const top = Math.max(...stats.monthlyTrend.map(m => m.done), 1);
    qrChartInstance = new Chart(ctx, {
      type: 'bar',
      data: { labels: stats.monthlyTrend.map(m => m.label), datasets: [{ data: stats.monthlyTrend.map(m => m.done), backgroundColor: c.ink, borderRadius: 6, maxBarThickness: 48 }] },
      options: { animation: false, responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } },
        scales: { x: { grid: { display: false }, ticks: { font, color: c.mid } }, y: { beginAtZero: true, ticks: { font, color: c.mid, stepSize: Math.max(1, Math.ceil(top / 4)) }, grid: { color: c.grid } } } },
    });
  }
};

window.copyQuarterlySummary = async () => {
  const { q, year } = qrGetSelection();
  const lbl = `Q${q} ${year}`;
  const qt = getQuarterTasksFor(year, q);
  if (!qt.length) { toast('No data for ' + lbl); return; }
  const stats = computeQuarterStats(qt, year, q);
  const prev = getPrevQuarter(year, q);
  const prevStats = computeQuarterStats(getQuarterTasksFor(prev.year, prev.q), prev.year, prev.q);

  const top3 = stats.leaderboard.slice(0, 3).map((m, i) => `${['🥇', '🥈', '🥉'][i]} ${m.name} (${m.done} tasks, ${m.pct}%)`).join('\n');
  const shipped = stats.projectSpotlight.filter(p => p.completed).map(p => p.name);

  const text = `📊 *WorkDesk — ${lbl} Summary*\n\n` +
    `${stats.done}/${stats.total} tasks completed (${stats.pct}%)\n` +
    `${stats.onTimeRate !== null ? stats.onTimeRate + '% delivered on time\n' : ''}` +
    `${stats.critResolved} critical issue${stats.critResolved === 1 ? '' : 's'} resolved\n` +
    `${stats.projectsCompletedThisQ}/${stats.projectCount} projects shipped this quarter\n\n` +
    `*Top Performers*\n${top3 || '—'}\n` +
    (shipped.length ? `\n*Shipped This Quarter*\n${shipped.map(s => '✓ ' + s).join('\n')}\n` : '') +
    `\n${generateHeadline(stats, prevStats, lbl).replace(/<\/?b>/g, '')}`;

  try { await navigator.clipboard.writeText(text); toast('Summary copied. Paste it anywhere.'); }
  catch (e) { window.prompt('Copy this summary:', text); }   // clipboard needs a secure context
};

        <div style="font-size:13px;font-weight:800;color:#111827">Top Performers</div>
        <div style="font-size:11px;color:#6b7280;margin-left:auto">${stats.leaderboard.length} contributor${stats.leaderboard.length===1?'':'s'}</div>
      </div>
      <table><tbody>${leaderboardHTML}</tbody></table>
    </div>

    <!-- PROJECTS -->
    <div style="margin-bottom:8px">
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:10px;padding-bottom:6px;border-bottom:2px solid #dbeafe">
        <div style="width:4px;height:16px;background:#2563eb;border-radius:2px"></div>
        <div style="font-size:13px;font-weight:800;color:#111827">Project Spotlight</div>
        <div style="font-size:11px;color:#6b7280;margin-left:auto">${stats.projectsCompletedThisQ}/${stats.projectCount} shipped</div>
      </div>
      ${projectHTML}
    </div>

    <!-- FOOTER -->
    <div style="margin-top:24px;padding-top:10px;border-top:1px solid #e5e7eb;display:flex;justify-content:space-between">
      <span style="font-size:8px;color:#9ca3af">WorkDesk · BBM-IN · MBC-IN Internal Communications</span>
      <span style="font-size:8px;color:#9ca3af">Generated ${new Date().toLocaleString('en-GB')}</span>
    </div>

  </body></html>`);
  win.document.close();
  setTimeout(()=>win.print(),500);
};


// ── SHARE (one button for every tab) ───────────────────────────────────────
const SHARE_OPTIONS = {
  quarterly: { sub: () => { const { q, year } = qrGetSelection(); return `Q${q} ${year}`; }, rows: [
    ['copy', 'Copy summary', 'Plain text for WhatsApp or email', 'copyQuarterlySummary'],
    ['print', 'Open printable report', 'Opens a new tab. Print it or save it as PDF.', 'exportQuarterlyPDF'] ] },
  monthly: { sub: () => monthLabel(selMonth), rows: [
    ['print', 'Open printable report', 'Opens a new tab. Print it or save it as PDF.', 'exportPDF'] ] },
  weekly: { sub: () => (window._weekDigestData && window._weekDigestData.weekLabel) || 'This week', rows: [
    ['copy', 'Copy digest', 'Plain text for WhatsApp', 'copyWeeklyDigest'] ] },
  myreport: { sub: () => getPeriodLabel(), rows: [
    ['print', 'Open printable report', 'Opens a new tab. Print it or save it as PDF.', 'exportMyReportPDF'] ] },
};
window.openShare = () => {
  const opt = SHARE_OPTIONS[activeRptTab];
  openSheet('rpt-share', `
    <h2 class="wd-sheet-title">Share this report</h2>
    <div class="wd-sheet-sub">${esc(opt.sub())}</div>
    <div class="rpt-share-list">${opt.rows.map(([ic, ti, no, fn]) =>
      `<button type="button" class="wd-mrow rpt-sh" onclick="runShare('${fn}')">${ICON[ic]}<span class="rpt-sh-t">${ti}<small>${no}</small></span></button>`).join('')}</div>`);
};
window.runShare = (fn) => { closeSheet('rpt-share'); window[fn](); };

initShell();
syncControls();
</script>
