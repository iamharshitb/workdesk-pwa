  Email:      '<path d="M6 1.4l4.6 4.6L6 10.6 1.4 6z" fill="currentColor" stroke="currentColor" stroke-width="1" stroke-linejoin="round"/>',
  Event:      '<circle cx="6" cy="6" r="4.4" fill="currentColor"/>',
  Social:     '<path d="M6 2v8M2 6h8" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round"/>',
  Livestream: '<circle cx="6" cy="6" r="3.9" fill="none" stroke="currentColor" stroke-width="1.8"/>',
  Other:      '<path d="M2.2 6h7.6" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round"/>',
};
const typeKey = t => (TYPES.includes(t) ? t : 'Other');
const typeGlyph = (type, size = 12, extra = '') =>
  `<span class="tg tg-${typeKey(type)}${extra}" aria-hidden="true"><svg width="${size}" height="${size}" viewBox="0 0 12 12">${SHAPE[typeKey(type)]}</svg></span>`;
const CHECK_SM = '<svg class="ck" width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
const haptic = n => { try { navigator.vibrate && navigator.vibrate(n); } catch (e) {} };
const plural = (n, one, many) => n + ' ' + (n === 1 ? one : many);

// ── state ──────────────────────────────────────────────────────────────────
let viewYear = new Date().getFullYear();
let viewMonth = new Date().getMonth();       // 0-indexed
let events = {};                              // { 'YYYY-MM-DD': [ { id, subject, type, people, status } ] }
let selectedDate = null;                      // the day open in the sheet
let selectedType = null;                      // type chosen in the form
let editingIdx = null;                        // index of the event being edited, or null
let wantTask = false;                         // "also add as a task" switch
let calMembers = [];                          // for the auto-created task
let activeFilter = 'All';                     // 'All' or a type
let calView = 'portrait';                     // 'portrait' | 'landscape'
let historyOpen = false;

try { if (localStorage.getItem('calView') === 'landscape') calView = 'landscape'; } catch (e) {}

// ── persistence ────────────────────────────────────────────────────────────
async function saveCalendar() {
  try { await saveCalendarData(events); return true; }
  catch (e) { console.error('Calendar save failed:', e); showNote('Could not save. Check your connection and try again.'); return false; }
}

// ── header, filter, view ───────────────────────────────────────────────────
function renderDow() {
  const names = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'];
  $('cal-dow').innerHTML = names.map(n => `<span><b>${n[0]}</b><i>${n}</i></span>`).join('');
}
function renderFilter() {
  $('cal-filter').innerHTML = ['All', ...TYPES].map(t =>
    `<button type="button" class="wd-chip${activeFilter === t ? ' on' : ''}" data-type="${t}" aria-pressed="${activeFilter === t}">${t === 'All' ? '' : typeGlyph(t)}${t}</button>`
  ).join('');
}
function applyView() {
  const wide = calView === 'landscape';
  document.body.classList.toggle('cal-wide', wide);
  $('view-btn').textContent = wide ? 'Portrait view' : 'Landscape view';
}
window.toggleView = () => {
  calView = calView === 'landscape' ? 'portrait' : 'landscape';
  try { localStorage.setItem('calView', calView); } catch (e) {}
  applyView(); renderCalendar(); haptic(6);
};

// ── grid ───────────────────────────────────────────────────────────────────
const pad2 = n => String(n).padStart(2, '0');
const dateKey = (y, m, d) => y + '-' + pad2(m + 1) + '-' + pad2(d);
function longDay(dateStr) {
  const [y, m, d] = dateStr.split('-').map(Number);
  return new Date(y, m - 1, d).toLocaleDateString('en-GB', { weekday: 'long', day: 'numeric', month: 'long' });
}

function evChip(e) {
  const sent = e.status === 'Sent', late = e.status === 'Delayed';
  return `<span class="cal-ev${sent ? ' ev-sent' : ''}${late ? ' ev-late' : ''}">${typeGlyph(e.type, 10)}<span class="t">${esc(e.subject)}</span>${sent ? CHECK_SM : ''}</span>`;
}
function evDot(e) {
  return typeGlyph(e.type, 11, e.status === 'Sent' ? ' ev-sent' : e.status === 'Delayed' ? ' ev-late' : '');
}

function renderCalendar() {
  $('cal-month').innerHTML = `${MONTHS[viewMonth]} <span class="yr">${viewYear}</span>`;

  const monthPrefix = viewYear + '-' + pad2(viewMonth + 1);
  const inMonth = Object.entries(events).filter(([d]) => d.startsWith(monthPrefix));
  const count = inMonth.reduce((s, [, arr]) => s + (activeFilter === 'All' ? arr.length : arr.filter(e => e.type === activeFilter).length), 0);
  $('cal-sub').textContent = activeFilter === 'All'
    ? (count ? plural(count, 'communication', 'communications') + ' this month' : 'Tap a date to add one')
    : (count ? count + ' ' + activeFilter + ' this month' : 'No ' + activeFilter + ' this month');

  const wide = calView === 'landscape';
  const firstDay = new Date(viewYear, viewMonth, 1).getDay();
  const gridStart = (firstDay + 6) % 7;                       // Monday-first
  const daysInMonth = new Date(viewYear, viewMonth + 1, 0).getDate();
  const daysInPrev = new Date(viewYear, viewMonth, 0).getDate();
  const total = Math.ceil((gridStart + daysInMonth) / 7) * 7;
  const today = localDateStr();

  const cells = [];
  for (let i = 0; i < total; i++) {
    let num, key, other = false;
    if (i < gridStart) {
      num = daysInPrev - gridStart + i + 1;
      key = viewMonth === 0 ? dateKey(viewYear - 1, 11, num) : dateKey(viewYear, viewMonth - 1, num);
      other = true;
    } else if (i >= gridStart + daysInMonth) {
      num = i - gridStart - daysInMonth + 1;
      key = viewMonth === 11 ? dateKey(viewYear + 1, 0, num) : dateKey(viewYear, viewMonth + 1, num);
      other = true;
    } else {
      num = i - gridStart + 1;
      key = dateKey(viewYear, viewMonth, num);
    }
    const all = events[key] || [];
    const list = activeFilter === 'All' ? all : all.filter(e => e.type === activeFilter);
    const cls = 'cal-day' + (other ? ' other' : '') + (key === today ? ' today' : '') + (activeFilter !== 'All' && !list.length ? ' dim' : '');
    const label = longDay(key) + (list.length ? ', ' + plural(list.length, 'communication', 'communications') : '');
    let inner;
    if (wide) {
      const max = 3, vis = list.slice(0, max);
      inner = `<span class="cal-n">${num}</span><span class="cal-evs">${vis.map(evChip).join('')}${list.length > max ? `<span class="cal-more">+${list.length - max} more</span>` : ''}</span>`;
    } else {
      const max = 4, vis = list.slice(0, max);
      inner = `<span class="cal-n">${num}</span><span class="cal-dots">${vis.map(evDot).join('')}${list.length > max ? '<i class="cal-plus">+</i>' : ''}</span>`;
    }
    cells.push(`<button type="button" class="${cls}" data-d="${key}" aria-label="${esc(label)}"${key === today ? ' aria-current="date"' : ''}>${inner}</button>`);
  }
  const grid = $('cal-days');
  grid.className = 'cal-days' + (wide ? ' wide' : '');
  grid.innerHTML = cells.join('');
  updateHistory();
}

window.prevMonth = () => { if (viewMonth === 0) { viewMonth = 11; viewYear--; } else viewMonth--; renderCalendar(); };
window.nextMonth = () => { if (viewMonth === 11) { viewMonth = 0; viewYear++; } else viewMonth++; renderCalendar(); };

// ── day sheet ──────────────────────────────────────────────────────────────
function daySheetHTML(dateStr) {
  const yr = Number(dateStr.slice(0, 4));
  const title = longDay(dateStr) + (yr !== new Date().getFullYear() ? ' ' + yr : '');
  return `
    <h2 class="wd-sheet-title" id="day-title">${esc(title)}</h2>
    <div class="wd-sheet-sub" id="day-sub"></div>
    <div id="ev-list"></div>

    <div class="wd-lab cal-form-h" id="ev-form-h">Add a communication</div>
    <input class="wd-field" id="ev-subject" placeholder="Subject, e.g. Q1 town hall invite" maxlength="100" autocomplete="off" enterkeyhint="done"
      oninput="clearFormError()" onkeydown="if(event.key==='Enter'){event.preventDefault();this.blur()}">
    <div class="wd-lab">Type</div>
    <div class="wd-chips" id="ev-types" role="group" aria-label="Type of communication">
      ${TYPES.map(t => `<button type="button" class="wd-chip" data-type="${t}" aria-pressed="false" onclick="pickType('${t}')">${typeGlyph(t)}${t}</button>`).join('')}
    </div>
    <div class="wd-lab">People <span class="opt">optional</span></div>
    <input class="wd-field" id="ev-people" placeholder="Harshit, Amrutha, Sriram" maxlength="100" autocomplete="off" enterkeyhint="done"
      onkeydown="if(event.key==='Enter'){event.preventDefault();this.blur()}">
    <button type="button" class="wd-mrow cal-task" id="ev-task" role="switch" aria-checked="false" onclick="toggleTask()">
      <span class="cal-task-t">Also add it as a task<small>Assigned to Harshit and Godly</small></span>
      <span class="wd-sw" id="ev-task-sw"></span>
    </button>
    <p class="wd-err" id="ev-err" role="alert" hidden></p>
    <button type="button" class="wd-btn p" id="ev-save" onclick="saveEvent()">Add to calendar</button>
    <button type="button" class="wd-btn s" id="ev-cancel" onclick="cancelEdit()" hidden>Cancel edit</button>`;
}

window.openDay = (dateStr) => {
  selectedDate = dateStr; selectedType = null; editingIdx = null; wantTask = false;
  openSheet('cal-day', daySheetHTML(dateStr), { onClose: () => { selectedDate = null; editingIdx = null; } });
  renderEventList();
  if (!(events[dateStr] || []).length) setTimeout(() => { const i = $('ev-subject'); if (i && selectedDate === dateStr) i.focus({ preventScroll: true }); }, 380);
};

function renderEventList() {
  const host = $('ev-list'); if (!host) return;
  const list = events[selectedDate] || [];
  $('day-sub').textContent = list.length ? plural(list.length, 'communication', 'communications') : 'Nothing planned yet';
  if (!list.length) { host.innerHTML = ''; return; }
  host.innerHTML = '<div class="cal-list">' + list.map((e, i) => {
    const st = e.status || 'Planned';
    return `<div class="cal-row${st === 'Sent' ? ' ev-sent' : ''}">
      ${typeGlyph(e.type, 14)}
      <div class="cal-row-b">
        <b>${esc(e.subject)}</b>
        <span class="cal-row-m">${esc(e.type || 'Other')}${e.people ? ' · ' + esc(e.people) : ''}</span>
        <button type="button" class="cal-st${st === 'Delayed' ? ' late' : ''}" onclick="cycleStatus(${i})" aria-label="Status: ${st}. Tap to change.">${glyphSVG(STATUS_GLYPH[st], 15)}${st}</button>
      </div>
      <button type="button" class="wd-x" onclick="editEvent(${i})" aria-label="Edit ${esc(e.subject)}">${ICON.edit}</button>
      <button type="button" class="wd-x" onclick="deleteEvent(${i})" aria-label="Delete ${esc(e.subject)}">${ICON.bin}</button>
    </div>`;
  }).join('') + '</div><p class="wd-hint cal-hint">Tap a status to move it on: Planned, Sent, Delayed.</p>';
}

window.pickType = (t) => {
  selectedType = selectedType === t ? null : t;
  document.querySelectorAll('#ev-types .wd-chip').forEach(c => {
    const on = c.dataset.type === selectedType;
    c.classList.toggle('on', on); c.setAttribute('aria-pressed', on);
  });
  clearFormError();
};
window.toggleTask = () => {
  wantTask = !wantTask;
  $('ev-task').setAttribute('aria-checked', wantTask);
  $('ev-task-sw').classList.toggle('on', wantTask);
};
function formError(msg, fieldId) {
  const e = $('ev-err'); e.textContent = msg; e.hidden = false;
  if (fieldId) { const f = $(fieldId); f.classList.add('bad'); f.focus(); }
  haptic(12);
}
window.clearFormError = () => { const e = $('ev-err'); if (e) e.hidden = true; const f = $('ev-subject'); if (f) f.classList.remove('bad'); };

function resetForm() {
  $('ev-subject').value = ''; $('ev-people').value = '';
  selectedType = null; editingIdx = null;
  document.querySelectorAll('#ev-types .wd-chip').forEach(c => { c.classList.remove('on'); c.setAttribute('aria-pressed', 'false'); });
  wantTask = false; $('ev-task').setAttribute('aria-checked', 'false'); $('ev-task-sw').classList.remove('on');
  $('ev-task').hidden = false;
  $('ev-form-h').textContent = 'Add a communication';
  $('ev-save').textContent = 'Add to calendar';
  $('ev-cancel').hidden = true;
  clearFormError();
}

window.editEvent = (idx) => {
  const ev = (events[selectedDate] || [])[idx]; if (!ev) return;
  editingIdx = idx;
  $('ev-subject').value = ev.subject || '';
  $('ev-people').value = ev.people || '';
  selectedType = ev.type || null;
  document.querySelectorAll('#ev-types .wd-chip').forEach(c => { const on = c.dataset.type === selectedType; c.classList.toggle('on', on); c.setAttribute('aria-pressed', on); });
  wantTask = false; $('ev-task').hidden = true;               // a task is only registered when adding
  $('ev-form-h').textContent = 'Edit communication';
  $('ev-save').textContent = 'Save changes';
  $('ev-cancel').hidden = false;
  clearFormError();
  $('ev-form-h').scrollIntoView({ behavior: 'smooth', block: 'start' });
  $('ev-subject').focus({ preventScroll: true });
};
window.cancelEdit = () => resetForm();

window.saveEvent = async () => {
  const subject = $('ev-subject').value.trim();
  const people = $('ev-people').value.trim();
  if (!subject) return formError('Write a subject for this communication.', 'ev-subject');
  if (!selectedType) return formError('Choose a type.');

  const date = selectedDate, type = selectedType;
  const wasEditing = editingIdx !== null;
  const makeTask = !wasEditing && wantTask;
  if (!events[date]) events[date] = [];

  let added = null;
  if (wasEditing) {
    const ev = events[date][editingIdx];
    if (ev) { ev.subject = subject; ev.type = type; ev.people = people; }
  } else {
    added = { id: Date.now(), subject, type, people, status: 'Planned' };
    events[date].push(added);
  }
  resetForm();
  renderEventList(); renderCalendar();
  const sh = sheetBody('cal-day'); if (sh) sh.scrollTo({ top: 0, behavior: 'smooth' });
  if (!(await saveCalendar())) return;

  if (makeTask) {
    try {
      const harshit = calMembers.find(m => m.name.toLowerCase().includes('harshit'));
      const godly = calMembers.find(m => m.name.toLowerCase().includes('godly'));
      const taskMembers = [harshit, godly].filter(Boolean).map(m => ({ id: m.id, name: m.name, role: type || 'Communication' }));
      await addTask({
        label: subject, priority: 'high', taskType: 'mbc',
        taskDueDate: date, dueDate: date, members: taskMembers,
        project: type + ' Communications',
      });
      showNote('Added, and registered as a task');
    } catch (e) {
      showNote('Added to the calendar, but the task failed: ' + e.message, 4200);
    }
  } else if (wasEditing) {
    showNote('Saved');
  } else {
    showUndo('Added to the calendar', async () => {
      const arr = events[date] || [];
      const at = arr.findIndex(x => x.id === added.id);
      if (at < 0) return;
      arr.splice(at, 1); if (!arr.length) delete events[date];
      if (selectedDate === date) renderEventList();
      renderCalendar(); await saveCalendar();
    });
  }
};

window.cycleStatus = async (idx) => {
  const ev = (events[selectedDate] || [])[idx]; if (!ev) return;
  ev.status = NEXT_STATUS[ev.status || 'Planned'];
  renderEventList(); renderCalendar(); haptic(6);
  await saveCalendar();
};

window.deleteEvent = async (idx) => {
  const date = selectedDate, arr = events[date]; if (!arr || !arr[idx]) return;
  const [removed] = arr.splice(idx, 1);
  if (!arr.length) delete events[date];
  if (editingIdx !== null) resetForm();
  renderEventList(); renderCalendar();
  await saveCalendar();
  showUndo('Removed', async () => {
    if (!events[date]) events[date] = [];
    events[date].splice(Math.min(idx, events[date].length), 0, removed);
    if (selectedDate === date) renderEventList();
    renderCalendar(); await saveCalendar();
  });
};

// ── the year, as a fold ────────────────────────────────────────────────────
window.toggleHistory = () => {
  historyOpen = !historyOpen;
  $('hist-toggle').setAttribute('aria-expanded', historyOpen);
  $('hist-body').hidden = !historyOpen;
  if (historyOpen) renderHistory();
};

function yearEntries() {
  const out = [];
  Object.entries(events).filter(([d]) => d.startsWith(String(viewYear))).forEach(([date, arr]) => arr.forEach(e => out.push({ date, ...e })));
  out.sort((a, b) => b.date.localeCompare(a.date));
  return out;
}
function updateHistory() {
  const n = yearEntries().length;
  $('hist-label').textContent = 'Communications ' + viewYear;
  $('hist-count').textContent = n;
  if (historyOpen) renderHistory();
}
function renderHistory() {
  const all = yearEntries(), body = $('hist-body');
  if (!all.length) { body.innerHTML = `<div class="wd-empty">Nothing recorded for ${viewYear} yet.<br>Tap a date above to add a communication.</div>`; return; }
  const byMonth = {};
  all.forEach(e => { (byMonth[e.date.slice(0, 7)] ||= []).push(e); });
  body.innerHTML = Object.entries(byMonth).sort((a, b) => b[0].localeCompare(a[0])).map(([key, items]) => {
    const mi = parseInt(key.slice(5), 10) - 1;
    return `<div class="wd-subhead"><span>${MONTHS[mi]} ${key.slice(0, 4)}</span><span>${items.length}</span></div>` +
      items.map(e => {
        const st = e.status || 'Planned';
        return `<button type="button" class="cal-h-row" onclick="openDay('${e.date}')">
          <span class="d">${parseInt(e.date.slice(8), 10)} ${MONTHS[mi].slice(0, 3)}</span>
          ${typeGlyph(e.type, 12)}
          <span class="s">${esc(e.subject)}</span>
          <span class="st${st === 'Delayed' ? ' late' : ''}">${st}</span>
        </button>`;
      }).join('');
  }).join('');
}

// ── wiring ─────────────────────────────────────────────────────────────────
$('cal-days').addEventListener('click', e => { const c = e.target.closest('.cal-day'); if (c) window.openDay(c.dataset.d); });
$('cal-filter').addEventListener('click', e => {
  const b = e.target.closest('button[data-type]'); if (!b) return;
  activeFilter = b.dataset.type; renderFilter(); renderCalendar(); haptic(4);
});

initShell();
renderDow(); renderFilter(); applyView(); renderCalendar();

onUserReady(async () => {
  try { calMembers = await getMembers(); } catch (e) { calMembers = []; }
  onCalendarDataChanged((data) => {
    if (data && typeof data === 'object') events = data;
    renderCalendar();
    if (selectedDate) renderEventList();
  });
});
</script>

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('/workdesk-pwa/sw.js', { scope: '/workdesk-pwa/' });
  });
}
</script>
