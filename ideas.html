<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>WorkDesk — Ideas</title>
<link rel="icon" href="icons/favicon.ico" sizes="32x32 48x48">
<link rel="icon" href="icons/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<script>/* set the skin before first paint (js/theme.js owns the rest) */(function(){var c='theme-light';try{var m=localStorage.getItem('wd_mode')||'auto';if(m==='dark'||(m==='auto'&&window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches))c='theme-dark';}catch(e){}document.documentElement.classList.add(c);})();</script>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/themes.css">
<link rel="stylesheet" href="css/ui.css?v=20261028">
</head>
<body>
<div class="wd-page" id="main" role="main">
  <header class="wd-appbar">
    <a href="index.html" class="wd-brand" aria-label="WorkDesk"><img class="wd-mark" src="icons/icon-mark.svg" alt="" width="30" height="30"><span class="wd-name"><b>Work</b><i>Desk</i></span></a>
    <button type="button" class="wd-av" id="me-btn" aria-label="Your profile and settings">·</button>
  </header>

  <div class="wd-title">
    <h1 class="wd-h1">Ideas</h1>
    <button type="button" class="rpt-share" onclick="openIdeaForm()"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>New idea</button>
  </div>
  <div class="wd-sub"><span id="ideas-sub">&nbsp;</span></div>

  <div class="ideas-quick">
    <label class="wd-lab" for="quick-inp">Quick capture</label>
    <div class="wd-addrow">
      <input class="wd-field" id="quick-inp" placeholder="Write an idea and press Enter" maxlength="160" enterkeyhint="done" autocomplete="off">
      <button type="button" class="wd-btn s" id="quick-btn">Add</button>
    </div>
    <p class="wd-hint">It goes to Ideation. Open it later to add details.</p>
  </div>

  <div class="wd-filter-chips ideas-chips" id="ideas-chips" role="group" aria-label="Filter by status"></div>

  <div id="ideas-list" class="ideas-list">
    <div class="wd-skel" aria-hidden="true">
      <div class="wd-skel-row"><b></b><div><i style="width:62%"></i><i style="width:40%;height:11px"></i></div></div>
      <div class="wd-skel-row"><b></b><div><i style="width:52%"></i><i style="width:34%;height:11px"></i></div></div>
      <div class="wd-skel-row"><b></b><div><i style="width:66%"></i><i style="width:38%;height:11px"></i></div></div>
    </div>
  </div>
</div>

<script type="module">
import { onUserReady, WORKSPACE_ID } from './js/firebase.js';
import { getApps } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
import {
  getFirestore, collection, doc, addDoc, updateDoc, deleteDoc,
  onSnapshot, query, orderBy, serverTimestamp
} from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';
import { initShell } from './js/shell.js';
import { esc, initials, ICON, glyphSVG, openSheet, closeSheet, showNote } from './js/ui.js';

const $ = id => document.getElementById(id);
const haptic = n => { try { navigator.vibrate && navigator.vibrate(n); } catch (e) {} };
const plural = (n, one, many) => n + ' ' + (n === 1 ? one : many);
const CHEV = ICON.chevron.replace('width="22" height="22"', 'width="20" height="20"');
const MY_NAME = localStorage.getItem('wd_myname') || 'Team';
initShell();

// Reuse the Firebase app that firebase.js already started.
const db = getFirestore(getApps()[0]);
const ideasCol = () => collection(db, 'workspaces', WORKSPACE_ID, 'ideas');
const ideaDoc = id => doc(db, 'workspaces', WORKSPACE_ID, 'ideas', id);
const notesCol = id => collection(db, 'workspaces', WORKSPACE_ID, 'ideas', id, 'notes');

// An idea's status uses the same four shapes as a task's.
const STATUS = {
  'ideation':    { label: 'Ideation',    glyph: 'todo' },
  'in-progress': { label: 'In progress', glyph: 'inprog' },
  'implemented': { label: 'Implemented', glyph: 'done' },
  'parked':      { label: 'Parked',      glyph: 'onhold' },
};
const CATS = ['Content', 'Campaign', 'Process', 'Tool', 'Event', 'Brand', 'Other'];

// ── state ──────────────────────────────────────────────────────────────────
let ideas = [];
let loaded = false;
let activeFilter = 'all';
const expanded = new Set();
const drafts = {};                 // unsent note text per idea, kept across live re-renders
const notesByIdea = {};            // live notes, subscribed once when an idea is first opened
const noteUnsubs = {};
let editingId = null, formCat = 'Content', formStatus = 'ideation';

const toDate = ts => (ts ? (ts.toDate ? ts.toDate() : new Date(ts)) : null);
function fmtDate(ts) {
  const d = toDate(ts);
  return d ? d.toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' }) : '';
}
function fmtTime(ts) {
  const d = toDate(ts);
  return d ? d.toLocaleDateString('en-GB', { day: 'numeric', month: 'short' }) + ' ' + d.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' }) : '';
}

// ── load ───────────────────────────────────────────────────────────────────
onUserReady(() => {
  onSnapshot(query(ideasCol(), orderBy('createdAt', 'desc')), snap => {
    ideas = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    loaded = true;
    render();
  }, err => { console.error('Ideas listener failed:', err); loaded = true; render(); });
});

// ── render ─────────────────────────────────────────────────────────────────
function renderChips() {
  const count = s => (s === 'all' ? ideas.length : ideas.filter(i => i.status === s).length);
  $('ideas-chips').innerHTML = [['all', 'All'], ...Object.entries(STATUS).map(([k, v]) => [k, v.label])].map(([k, label]) =>
    `<button type="button" class="wd-chip${activeFilter === k ? ' on' : ''}" aria-pressed="${activeFilter === k}" data-status="${k}">${label}${count(k) ? ` <span class="ct">${count(k)}</span>` : ''}</button>`
  ).join('');
}

function ideaHTML(idea) {
  const st = STATUS[idea.status] || STATUS.ideation;
  const open = expanded.has(idea.id);
  const n = idea.noteCount || 0;
  const meta = [st.label, idea.category || 'Other', fmtDate(idea.createdAt), n ? plural(n, 'note', 'notes') : ''].filter(Boolean).map(esc).join(' · ');
  const others = Object.entries(STATUS).filter(([k]) => k !== (idea.status || 'ideation'));
  return `<div class="idea" data-id="${esc(idea.id)}">
    <button type="button" class="idea-hd" aria-expanded="${open}" aria-controls="idea-b-${esc(idea.id)}" data-act="toggle">
      <span class="g">${glyphSVG(st.glyph, 20)}</span>
      <span class="idea-t"><b>${esc(idea.title)}</b><span>${meta}</span></span>${CHEV}
    </button>
    <div class="idea-b" id="idea-b-${esc(idea.id)}"${open ? '' : ' hidden'}>
      ${idea.description ? `<p class="idea-desc">${esc(idea.description)}</p>` : '<p class="idea-desc none">No description yet.</p>'}
      <div class="wd-lab">Notes</div>
      <div class="idea-notes" id="idea-notes-${esc(idea.id)}"></div>
      <div class="wd-addrow">
        <input class="wd-field" id="note-inp-${esc(idea.id)}" placeholder="Add a note" maxlength="500" enterkeyhint="send" autocomplete="off" aria-label="Add a note" value="${esc(drafts[idea.id] || '')}">
        <button type="button" class="wd-btn s" data-act="note">Add</button>
      </div>
      <div class="wd-lab">Move to</div>
      <div class="wd-chips">${others.map(([k, v]) => `<button type="button" class="wd-chip" data-act="status" data-status="${k}"><span class="mg">${glyphSVG(v.glyph, 16)}</span>${v.label}</button>`).join('')}</div>
      <div class="wd-btns">
        <button type="button" class="wd-btn s" data-act="edit">Edit</button>
        <button type="button" class="wd-btn s danger" data-act="delete">Delete</button>
      </div>
    </div>
  </div>`;
}

function render() {
  renderChips();
  $('ideas-sub').textContent = !loaded ? '' : ideas.length ? plural(ideas.length, 'idea', 'ideas') : 'Nothing captured yet';
  const el = $('ideas-list');
  if (!loaded) return;
  const list = activeFilter === 'all' ? ideas : ideas.filter(i => (i.status || 'ideation') === activeFilter);
  if (!list.length) {
    el.innerHTML = ideas.length
      ? '<div class="wd-empty"><b>Nothing here</b>No ideas have this status.</div>'
      : '<div class="wd-empty"><b>No ideas yet</b>Use Quick capture above, or New idea to add details straight away.</div>';
    return;
  }
  el.innerHTML = `<div class="rpt-list">${list.map(ideaHTML).join('')}</div>`;
  expanded.forEach(id => { if (el.querySelector(`.idea[data-id="${CSS.escape(id)}"]`)) loadNotes(id); });
}

// ── notes ──────────────────────────────────────────────────────────────────
function loadNotes(id) {
  if (notesByIdea[id]) { renderNotes(id); return; }
  renderNotes(id);                                  // "No notes yet" / loading state while the first snapshot arrives
  noteUnsubs[id] = onSnapshot(query(notesCol(id), orderBy('createdAt', 'asc')), snap => {
    notesByIdea[id] = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    renderNotes(id);
  });
}
function renderNotes(id) {
  const el = $('idea-notes-' + id);
  if (!el) return;
  const notes = notesByIdea[id];
  if (!notes) { el.innerHTML = '<p class="idea-none">Loading notes…</p>'; return; }
  if (!notes.length) { el.innerHTML = '<p class="idea-none">No notes yet. Add the first one.</p>'; return; }
  el.innerHTML = notes.map(n => `<div class="idea-note"><span class="wd-av sm quiet">${esc(initials(n.author || 'Team'))}</span><div><b>${esc(n.author || 'Team')}<i>${esc(fmtTime(n.createdAt))}</i></b><span>${esc(n.text)}</span></div></div>`).join('');
}

async function addNote(id) {
  const inp = $('note-inp-' + id);
  const text = inp && inp.value.trim();
  if (!text) return;
  inp.value = ''; delete drafts[id];
  try {
    await addDoc(notesCol(id), { text, author: MY_NAME, createdAt: serverTimestamp() });
    const idea = ideas.find(i => i.id === id);
    await updateDoc(ideaDoc(id), { noteCount: (idea?.noteCount || 0) + 1 });
    haptic(6);
  } catch (e) {
    console.error('Note failed:', e);
    inp.value = text; drafts[id] = text;
    showNote('Could not add the note. Check your connection and try again.');
  }
}

async function setStatus(id, status) {
  try {
    await updateDoc(ideaDoc(id), { status, updatedAt: serverTimestamp() });
    showNote('Moved to ' + STATUS[status].label);
    haptic(6);
  } catch (e) { console.error(e); showNote('Could not update the idea. Try again.'); }
}

// ── list interaction ───────────────────────────────────────────────────────
$('ideas-chips').addEventListener('click', e => {
  const chip = e.target.closest('[data-status]');
  if (!chip) return;
  activeFilter = chip.dataset.status;
  render();
});

$('ideas-list').addEventListener('click', e => {
  const btn = e.target.closest('[data-act]');
  const card = e.target.closest('.idea');
  if (!btn || !card) return;
  const id = card.dataset.id;
  switch (btn.dataset.act) {
    case 'toggle': {
      const open = !expanded.has(id);
      if (open) { expanded.add(id); loadNotes(id); } else expanded.delete(id);
      btn.setAttribute('aria-expanded', open);
      $('idea-b-' + id).hidden = !open;
      break;
    }
    case 'note': addNote(id); break;
    case 'status': setStatus(id, btn.dataset.status); break;
    case 'edit': openIdeaForm(id); break;
    case 'delete': confirmDelete(id); break;
  }
});
$('ideas-list').addEventListener('input', e => {
  if (e.target.id && e.target.id.startsWith('note-inp-')) drafts[e.target.id.slice(9)] = e.target.value;
});
$('ideas-list').addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target.id && e.target.id.startsWith('note-inp-')) { e.preventDefault(); addNote(e.target.id.slice(9)); }
});

// ── quick capture ──────────────────────────────────────────────────────────
async function quickCapture() {
  const inp = $('quick-inp');
  const title = inp.value.trim();
  if (!title) return;
  inp.value = '';
  try {
    await addDoc(ideasCol(), { title, description: '', category: 'Other', status: 'ideation', author: MY_NAME, noteCount: 0, createdAt: serverTimestamp(), updatedAt: serverTimestamp() });
    showNote('Idea captured'); haptic(8);
  } catch (e) { console.error(e); inp.value = title; showNote('Could not save the idea. Try again.'); }
}
$('quick-btn').addEventListener('click', quickCapture);
$('quick-inp').addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); quickCapture(); } });

// ── new / edit sheet ───────────────────────────────────────────────────────
window.openIdeaForm = (id) => {
  const idea = id ? ideas.find(i => i.id === id) : null;
  editingId = idea ? idea.id : null;
  formCat = idea ? (idea.category || 'Other') : 'Content';
  formStatus = 'ideation';
  const sheet = openSheet('idea-form', `
    <h2 class="wd-sheet-title">${idea ? 'Edit idea' : 'New idea'}</h2>
    <div class="idea-form">
      <div class="wd-lab">Title</div>
      <input class="wd-field" id="if-title" placeholder="What is the idea?" maxlength="160" autocomplete="off" value="${esc(idea ? idea.title : '')}">
      <p class="wd-err" id="if-err" role="alert" hidden>Give the idea a title.</p>
      <div class="wd-lab">Category</div>
      <div class="wd-chips" id="if-cats">${CATS.map(c => `<button type="button" class="wd-chip${c === formCat ? ' on' : ''}" aria-pressed="${c === formCat}" data-cat="${c}">${c}</button>`).join('')}</div>
      <div class="wd-lab">Description<span class="opt">optional</span></div>
      <textarea class="wd-field" id="if-desc" rows="4" maxlength="800" placeholder="Why it matters and how it could work">${esc(idea ? idea.description || '' : '')}</textarea>
      ${idea ? '' : `<div class="wd-lab">Start as</div>
      <div class="wd-chips" id="if-status">${['ideation', 'in-progress'].map(k => `<button type="button" class="wd-chip${k === formStatus ? ' on' : ''}" aria-pressed="${k === formStatus}" data-st="${k}"><span class="mg">${glyphSVG(STATUS[k].glyph, 16)}</span>${STATUS[k].label}</button>`).join('')}</div>`}
      <button type="button" class="wd-btn p" id="if-save">${idea ? 'Save changes' : 'Add idea'}</button>
      <button type="button" class="wd-btn s" id="if-cancel">Cancel</button>
    </div>`);
  const pick = (box, attr, set) => box && box.addEventListener('click', e => {
    const b = e.target.closest('[' + attr + ']'); if (!b) return;
    set(b.getAttribute(attr));
    box.querySelectorAll('.wd-chip').forEach(x => { const on = x === b; x.classList.toggle('on', on); x.setAttribute('aria-pressed', on); });
  });
  pick(sheet.querySelector('#if-cats'), 'data-cat', v => { formCat = v; });
  pick(sheet.querySelector('#if-status'), 'data-st', v => { formStatus = v; });
  sheet.querySelector('#if-title').addEventListener('input', () => { sheet.querySelector('#if-err').hidden = true; sheet.querySelector('#if-title').classList.remove('bad'); });
  sheet.querySelector('#if-cancel').onclick = () => closeSheet('idea-form');
  sheet.querySelector('#if-save').onclick = saveIdea;
  if (!idea) setTimeout(() => { const f = $('if-title'); if (f) f.focus(); }, 320);
};

async function saveIdea() {
  const title = $('if-title').value.trim();
  const description = $('if-desc').value.trim();
  if (!title) { $('if-err').hidden = false; $('if-title').classList.add('bad'); $('if-title').focus(); return; }
  const btn = $('if-save');
  btn.disabled = true;
  try {
    if (editingId) {
      await updateDoc(ideaDoc(editingId), { title, description, category: formCat, updatedAt: serverTimestamp() });
      showNote('Idea updated');
    } else {
      await addDoc(ideasCol(), { title, description, category: formCat, status: formStatus, author: MY_NAME, noteCount: 0, createdAt: serverTimestamp(), updatedAt: serverTimestamp() });
      showNote('Idea added');
    }
    haptic(8);
    closeSheet('idea-form');
  } catch (e) {
    console.error('Idea save failed:', e);
    btn.disabled = false;
    showNote('Could not save the idea. Check your connection and try again.');
  }
}

function confirmDelete(id) {
  const idea = ideas.find(i => i.id === id);
  if (!idea) return;
  const sheet = openSheet('idea-del', `
    <h2 class="wd-sheet-title">Delete this idea?</h2>
    <p class="wd-sheet-note">“${esc(idea.title)}” will be removed for everyone. This can’t be undone.</p>
    <button type="button" class="wd-btn p" id="id-go" style="margin-top:22px">Delete idea</button>
    <button type="button" class="wd-btn s" id="id-no">Cancel</button>`);
  sheet.querySelector('#id-no').onclick = () => closeSheet('idea-del');
  sheet.querySelector('#id-go').onclick = async () => {
    closeSheet('idea-del');
    try {
      await deleteDoc(ideaDoc(id));
      expanded.delete(id); delete drafts[id];
      if (noteUnsubs[id]) { try { noteUnsubs[id](); } catch (e) {} delete noteUnsubs[id]; delete notesByIdea[id]; }
      showNote('Idea deleted');
    } catch (e) { console.error(e); showNote('Could not delete the idea. Try again.'); }
  };
}
</script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('/workdesk-pwa/sw.js', { scope: '/workdesk-pwa/' });
  });
}
</script>
